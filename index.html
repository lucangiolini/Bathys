function go(p){NAV.push(p);renderSettings();$('#setBody').scrollTop=0;}
function back(){NAV.pop();renderSettings();}
function num(label,path,unit,min,max,dec,th,extra){return Object.assign({t:'num',label,path,unit,min,max,dec:dec||0,th},extra||{});}
function gasEditorRows(listPath,g){
  const E=E0(), L=S.lim, cylOpts=S.cyls.map(c=>[c.id,c.name]);
  const lim=g.role==='deco'?L.ppo2Deco:L.ppo2Bottom;
  const info=[];
  info.push({t:'info',label:'MOD a ppO₂ '+fmt(lim,2),value:fmt(modOf(E,g,lim),0)+' m',th:'mod'});
  const md=minDepthOf(E,g,L.ppo2Min);
  if(md>0) info.push({t:'info',label:'Respirabile da',value:fmt(md,0)+' m',th:'ppo2Min'});
  return [
    {rows:[
      {t:'num',label:'Ossigeno',get:()=>g.o2,set:v=>{g.o2=v;const x=g.h2||0;if(g.o2+g.he+x>100){g.he=Math.max(0,100-g.o2-x);if(g.o2+g.he+x>100) g.h2=Math.max(0,100-g.o2-g.he);}},unit:'%',min:S.h2exp?1:5,max:100,dec:0,th:'o2'},
      {t:'num',label:'Elio',get:()=>g.he,set:v=>{g.he=Math.min(v,100-g.o2-(g.h2||0));},unit:'%',min:0,max:98,dec:0,th:'he'},
      ...(S.h2exp?[{t:'num',label:'Idrogeno',get:()=>g.h2||0,set:v=>{g.h2=Math.min(v,100-g.o2-g.he);},unit:'%',min:0,max:98,dec:0,th:'h2'}]:[]),
      ...((g.h2||0)>0&&g.o2>S.h2cfg.o2max?[{t:'alert',label:'PERICOLO DI MORTE: con idrogeno l’ossigeno deve restare sotto il '+S.h2cfg.o2max+'%, altrimenti la miscela è esplosiva.',th:'h2'}]:[]),
      {t:'seg',label:'Ruolo',opts:[['fondo','Fondo'],['viaggio','Viaggio'],['deco','Deco']],get:()=>g.role,set:v=>{g.role=v;},th:'role'}
    ]},
    {head:'Cambio',rows:[
      {t:'tog',label:'Cambio automatico',get:()=>g.sw==null||g.sw==='',set:v=>{g.sw=v?null:Math.round(modOf(E,g,lim)/S.algo.stopInt)*S.algo.stopInt;},th:'sw'},
      ...(g.sw==null||g.sw===''?[]:[{t:'num',label:'Profondità di cambio',get:()=>g.sw,set:v=>{g.sw=v;},unit:'m',min:0,max:400,dec:0,th:'sw'}]),
      ...info
    ]},
    {head:'Bombola',rows:[
      {t:'pick',label:'Tipo',opts:cylOpts.concat([['__custom','Personalizzata…']]),get:()=>g.cyl,set:v=>{if(v==='__custom'){const c={id:uid(),name:'Personalizzata',vol:10,bar:232};S.cyls.push(c);g.cyl=c.id;save();setTimeout(()=>go('cyl|'+c.id),10);return;}g.cyl=v;},th:'cyls'},
      {t:'num',label:'Quante',get:()=>g.n||1,set:v=>{g.n=v;},unit:'',min:1,max:6,dec:0,th:'cyls'}
    ]},
    {rows:[{t:'act',label:'Elimina gas',danger:true,run:()=>{const arr=getP(listPath);const i=arr.indexOf(g);if(i>=0) arr.splice(i,1);save();back();}}]}
  ];
}
function gasListPage(path,title,foot){
  const arr=getP(path);
  return {title,groups:[
    {rows:arr.map(g=>({t:'link',label:gasName(g),value:roleName(g.role)+', '+(g.n||1)+' × '+cylOf(g.cyl).name,to:'gas|'+path+'|'+g.id,th:'role'}))
      .concat([{t:'act',label:'Aggiungi gas',run:()=>{const g=G(32,0,arr.length?'deco':'fondo','s80',1);arr.push(g);save();go('gas|'+path+'|'+g.id);}}]),foot}
  ]};
}
function roleName(r){return r==='fondo'?'fondo':r==='viaggio'?'viaggio':'deco';}
function page(id){
  const P=id.split('|');
  switch(P[0]){
  case 'root': return {title:'Impostazioni',groups:[
    {rows:[{t:'link',label:'Piani preimpostati',value:'',to:'presets',th:'presets'}]},
    {rows:[
      {t:'link',label:'Algoritmo',value:'ZHL-16C, GF '+S.algo.gfLo+'/'+S.algo.gfHi,to:'algo',th:'model'},
      {t:'link',label:'Velocità',value:'↓'+fmt(S.rates.desc,0)+'  ↑'+fmt(S.rates.asc,0)+' m/min',to:'rates',th:'asc'},
      {t:'link',label:'Gas',value:gasList(S.gases),to:'gases',th:'gases'},
      {t:'link',label:'Limiti',value:'ppO₂ '+fmt(S.lim.ppo2Bottom,1)+'/'+fmt(S.lim.ppo2Deco,1),to:'lim',th:'ppo2Bottom'},
      {t:'link',label:'Avvisi',value:'END '+S.lim.endMax+' m, CNS '+S.warn.cnsWarn+'%',to:'warn',th:'warnPage'},
      {t:'link',label:'CCR',value:'SP '+fmt(S.ccr.spLow,1)+' → '+fmt(S.ccr.spHigh,1),to:'ccr',th:'mode'},
      {t:'link',label:'Consumo e riserve',value:'SAC '+S.cons.sacBottom+'/'+S.cons.sacDeco,to:'cons',th:'sacBottom'},
      {t:'link',label:'Bombole',value:S.cyls.length+' tipi',to:'cyls',th:'cyls'},
      {t:'link',label:'Contingenza',value:S.cont.list.length+(S.cont.list.length===1?' scenario':' scenari'),to:'cont',th:'cont'},
      {t:'link',label:'Penetrazione',value:S.pen.on?'attiva, regola 1/'+S.pen.rule:'spenta',to:'pen',th:'pen'},
      {t:'link',label:'Ambiente e aspetto',value:(S.env.water==='salt'?'mare':'acqua dolce')+', '+S.env.alt+' m',to:'env',th:'water'}
    ]},
    {rows:[{t:'link',label:'Sperimentale',value:S.h2exp?'idrogeno attivo':'spento',to:'exp',th:'h2'}]},
    {rows:[{t:'link',label:'Avvertenze',value:'',to:'about',th:'about'},{t:'act',label:'Cerca aggiornamenti',run:()=>checkUpdate(false)}],foot:'Tieni premuto su una voce per leggere l’approfondimento. Versione '+APP_VERSION+'.'},
    {rows:[{t:'act',label:'Ripristina impostazioni',danger:true,run:()=>openConfirm({title:'Ripristinare?',text:'Tutte le impostazioni, i gas, le bombole e i preset tornano ai valori iniziali.',yes:'Ripristina',onYes:()=>{S=defaults();S.seenIntro=true;S.tutDone=true;save();closeSettings();toast('Valori predefiniti ripristinati');}})}]}
  ]};
  case 'presets': return {title:'Piani preimpostati',groups:[
    {rows:S.presets.map(p=>({t:'link',label:p.name,value:p.mode==='ccr'?'CCR':'OC',to:'preset|'+p.id,th:'presets'}))},
    {rows:[{t:'act',label:'Salva la configurazione attuale',run:()=>openText({title:'Nome del preset',value:'',okLabel:'Salva',onOk:n=>{S.presets.push(snapshot(n));S.presetName=n;save();renderSettings();toast('Preset salvato');}})}],
     foot:'Un preset salva modalità, settori, gas, CCR e gradient factors.'}
  ]};
  case 'preset':{
    const p=S.presets.find(x=>x.id===P[1]);if(!p) return page('presets');
    const lv=p.levels.map(l=>l.d+' m fino al '+l.t+'′').join(', ');
    return {title:p.name,groups:[
      {rows:[{t:'info',label:'Settori',value:lv},{t:'info',label:p.mode==='ccr'?'Diluente':'Gas',value:p.mode==='ccr'?gasName(p.dil):gasList(p.gases||[])},{t:'info',label:'GF',value:p.gf[0]+'/'+p.gf[1]}]},
      {rows:[
        {t:'act',label:'Applica',run:()=>{applyPreset(p);closeSettings();toast('Preset “'+p.name+'” applicato');}},
        {t:'act',label:'Aggiorna con la configurazione attuale',run:()=>{Object.assign(p,snapshot(p.name),{id:p.id});save();renderSettings();toast('Preset aggiornato');}},
        {t:'act',label:'Rinomina',run:()=>openText({title:'Rinomina',value:p.name,onOk:n=>{if(S.presetName===p.name) S.presetName=n;p.name=n;save();renderSettings();}})},
        {t:'act',label:'Elimina preset',danger:true,run:()=>openConfirm({title:'Eliminare?',text:'Il preset “'+p.name+'” verrà eliminato.',yes:'Elimina',onYes:()=>{S.presets=S.presets.filter(x=>x!==p);save();back();}})}
      ]}
    ]};}
  case 'algo': return {title:'Algoritmo',groups:[
    {rows:[{t:'info',label:'Modello',value:'Bühlmann ZHL-16C',th:'model'}]},
    {head:'Gradient factors',rows:[
      num('GF basso','algo.gfLo','%',10,100,0,'gfLo'),
      num('GF alto','algo.gfHi','%',10,100,0,'gfHi')]},
    {head:'Soste',rows:[
      num('Intervallo tra le soste','algo.stopInt','m',1,6,0,'stopInt'),
      {t:'seg',label:'Ultima sosta',opts:[[3,'3 m'],[6,'6 m']],path:'algo.lastStop',th:'lastStop'},
      num('Durata del cambio gas','algo.switchTime','min',0,5,0,'switchTime')]}
  ]};
  case 'rates': return {title:'Velocità',groups:[{rows:[
    num('Discesa','rates.desc','m/min',1,60,0,'desc'),
    num('Risalita fino alla prima sosta','rates.asc','m/min',1,20,0,'asc'),
    num('Tra le soste','rates.stops','m/min',1,20,0,'stops'),
    num('Dall’ultima sosta alla superficie','rates.surf','m/min',0.5,10,1,'surf')]}]};
  case 'gases':{const pg=gasListPage('gases','Gas','Valgono per il circuito aperto. In risalita il planner passa sempre al gas più ricco di ossigeno utilizzabile.');
    if(isHydroOC(S)){const H=hydroChain(S),E=E0();pg.groups.unshift({head:'Modalità idrogeno',rows:H.gases.filter(g=>g!==H.bot).map(g=>({t:'info',label:gasName(g),value:g.trans?'a '+H.dH2+' m, lavaggio':(g.role==='deco'?'deco da ':'viaggio da ')+Math.round(modOf(E,g,g.role==='deco'?S.lim.ppo2Deco:S.lim.ppo2Bottom))+' m',th:'h2chain'})),foot:'Le stage sono calcolate da Bathys: gli altri gas della lista non vengono usati finché il gas di fondo contiene idrogeno. Il numero di stage si sceglie in Sperimentale.'});}
    return pg;}
  case 'bailout': return gasListPage('ccr.bailout','Bailout','Se la lista è vuota il bailout usa il diluente e i gas del circuito aperto.');
  case 'gas':{
    const arr=getP(P[1]), g=arr&&arr.find(x=>x.id===P[2]);
    if(!g) return page(P[1]==='gases'?'gases':'bailout');
    return {title:gasName(g),groups:gasEditorRows(P[1],g)};}
  case 'lim': return {title:'Limiti',groups:[
    {head:'Ossigeno',rows:[
      num('ppO₂ massima sul fondo','lim.ppo2Bottom','bar',0.8,1.6,2,'ppo2Bottom',{step:0.05}),
      num('ppO₂ massima in deco','lim.ppo2Deco','bar',1.0,1.7,2,'ppo2Deco',{step:0.05}),
      num('ppO₂ minima','lim.ppo2Min','bar',0.10,0.21,2,'ppo2Min',{step:0.01})],
     foot:'Questi limiti decidono anche quando cambiare gas. Gli avvisi si configurano in Avvisi.'},
    {head:'Narcosi',rows:[{t:'tog',label:'Ossigeno narcotico',path:'lim.o2Narc',th:'o2Narc'}]}
  ]};
  case 'warn':{const w=S.warn;const rows1=[{t:'tog',label:'ppO₂ oltre i limiti',path:'warn.ppo2',th:'ppo2Bottom'},{t:'tog',label:'Gas ipossici',path:'warn.hypo',th:'ppo2Min'}];
    const rows2=[{t:'tog',label:'Narcosi (END)',path:'warn.end',th:'endMax'}];if(w.end) rows2.push(num('END massima','lim.endMax','m',10,60,0,'endMax'));
    rows2.push({t:'tog',label:'Densità del gas',path:'warn.dens',th:'densMax'});if(w.dens){rows2.push(num('Densità consigliata','lim.densMax','g/L',3,8,1,'densMax',{step:0.1}));rows2.push(num('Densità massima','warn.densAbs','g/L',4,9,1,'densMax',{step:0.1}));}
    const rows3=[{t:'tog',label:'CNS',path:'warn.cns',th:'cns'}];if(w.cns){rows3.push(num('Avviso CNS','warn.cnsWarn','%',10,150,0,'cns'));rows3.push(num('Limite CNS','warn.cnsMax','%',10,200,0,'cns'));}
    rows3.push({t:'tog',label:'OTU',path:'warn.otu',th:'otu'});if(w.otu) rows3.push(num('OTU massime','warn.otuMax','',50,2000,0,'otu',{step:10}));
    const rows4=[{t:'tog',label:'Controdiffusione isobarica',path:'lim.icd',th:'icd'},{t:'tog',label:'Oltre la validazione del modello',path:'warn.deep',th:'model'}];if(w.deep) rows4.push(num('Da','warn.deepVal','m',50,400,0,'model',{step:10}));
    rows4.push({t:'tog',label:'Riserve di gas',path:'warn.reserve',th:'reserve'});
    return {title:'Avvisi',groups:[{head:'Ossigeno',rows:rows1},{head:'Narcosi e respirazione',rows:rows2},{head:'Tossicità',rows:rows3},{head:'Altro',rows:rows4},
      {head:'Idrogeno',rows:[{t:'info',label:'Ossigeno massimo con idrogeno',value:S.h2cfg.o2max+'%',th:'h2'}],foot:'L’avviso di miscela esplosiva resta sempre attivo; il valore si cambia in Sperimentale. Anche “gas insufficiente” resta sempre visibile.'}]};}
  case 'ccr': return {title:'CCR',groups:[
    {head:'Setpoint',rows:[
      num('Basso, in discesa','ccr.spLow','bar',0.4,1.0,2,'spLow',{step:0.05}),
      num('Passa all’alto a','ccr.spSwitch','m',0,100,0,'spSwitch'),
      num('Alto, fondo e risalita','ccr.spHigh','bar',0.8,1.5,2,'spHigh',{step:0.05}),
      num('In decompressione','ccr.spDeco','bar',0.8,1.6,2,'spDeco',{step:0.05})]},
    {head:'Diluente',rows:[
      num('Ossigeno','ccr.dil.o2','%',5,100,0,'dil'),
      num('Elio','ccr.dil.he','%',0,95,0,'dil'),
      {t:'info',label:'Flush alla massima',value:'ppO₂ '+fmt(ppO2(E0(),S.ccr.dil,Math.max(...S.levels.map(l=>l.d))),2),th:'dil'}]},
    {head:'Bombolini',rows:[
      num('Ossigeno, volume','ccr.o2Vol','L',0.5,7,1,'bottles',{step:0.5}),
      num('Ossigeno, carica','ccr.o2Bar','bar',50,300,0,'bottles'),
      num('Diluente, volume','ccr.dilVol','L',0.5,7,1,'bottles',{step:0.5}),
      num('Diluente, carica','ccr.dilBar','bar',50,300,0,'bottles')]},
    {head:'Consumi',rows:[
      num('Ossigeno metabolico','ccr.metab','L/min',0.4,3,1,'metab',{step:0.1}),
      num('Volume del loop','ccr.loop','L',2,15,1,'loop',{step:0.5}),
      num('Diluente extra','ccr.dilExtra','L',0,500,0,'dilExtra',{step:10})]},
    {rows:[{t:'link',label:'Gas di bailout',value:S.ccr.bailout.length?gasList(S.ccr.bailout):'gas disponibili',to:'bailout',th:'bailout'}]}
  ]};
  case 'cons': return {title:'Consumo e riserve',groups:[
    {head:'SAC',rows:[
      num('Sul fondo','cons.sacBottom','L/min',5,60,0,'sacBottom'),
      num('In risalita e soste','cons.sacDeco','L/min',5,60,0,'sacDeco'),
      num('Fattore stress','cons.stress','×',1,4,1,'stress',{step:0.1})]},
    {head:'Riserva',rows:[
      {t:'seg',label:'Metodo',opts:[['rock','Gas minimo'],['thirds','Terzi'],['none','Nessuna']],path:'cons.reserve',th:'reserve'},
      num('Minuti per risolvere il problema','cons.problemMin','min',0,10,0,'problemMin'),
      num('Subacquei sulla stessa scorta','cons.divers','',1,4,0,'divers')]}
  ]};
  case 'cyls': return {title:'Bombole',groups:[{rows:S.cyls.map(c=>({t:'link',label:c.name,value:fmt(c.vol,1)+' L, '+c.bar+' bar',to:'cyl|'+c.id,th:'cyls'}))
      .concat([{t:'act',label:'Aggiungi bombola personalizzata',run:()=>{const c={id:uid(),name:'Nuova',vol:10,bar:232};S.cyls.push(c);save();go('cyl|'+c.id);}}]),
      foot:'Servono solo per il calcolo del gas: volume interno e pressione di carica.'}]};
  case 'cyl':{
    const c=S.cyls.find(x=>x.id===P[1]);if(!c) return page('cyls');
    const used=S.gases.concat(S.ccr.bailout).some(g=>g.cyl===c.id);
    return {title:c.name,groups:[{rows:[
      {t:'text',label:'Nome',get:()=>c.name,set:v=>{c.name=v;}},
      {t:'num',label:'Volume',get:()=>c.vol,set:v=>{c.vol=v;},unit:'L',min:0.5,max:50,dec:1,th:'cyls',step:0.1},
      {t:'num',label:'Pressione di carica',get:()=>c.bar,set:v=>{c.bar=v;},unit:'bar',min:50,max:350,dec:0,th:'cyls'},
      {t:'info',label:'Capacità',value:fmtL(c.vol*c.bar)+' L'}]},
      {rows:[used||S.cyls.length<2?{t:'info',label:used?'In uso da almeno un gas':'Serve almeno una bombola',value:''}:{t:'act',label:'Elimina bombola',danger:true,run:()=>{S.cyls=S.cyls.filter(x=>x!==c);save();back();}}]}]};}
  case 'inv':{
    const r=invSolve(), lv=lvl(), v=S.inv;
    const res=r.none?{t:'info',label:'Attiva almeno un vincolo',value:''}:r.t==null?{t:'info',label:'Nessun tempo rispetta i vincoli',value:''}:{t:'info',label:'Settore '+(S.act+1)+' a '+lv.d+' m',value:'fino al minuto '+r.t,th:'inv'};
    const rows=[];
    rows.push({t:'tog',label:'Emersione entro un orario',path:'inv.rtOn',th:'inv'});
    if(v.rtOn) rows.push(num('Minuto massimo di emersione','inv.rt','min',5,3000,0,'inv'));
    rows.push({t:'tog',label:'Risalita massima',path:'inv.ttsOn',th:'inv'});
    if(v.ttsOn) rows.push(num('Minuti di risalita','inv.tts','min',1,3000,0,'inv'));
    rows.push({t:'tog',label:'CNS massimo',path:'inv.cnsOn',th:'cns'});
    if(v.cnsOn) rows.push(num('CNS','inv.cns','%',10,150,0,'cns'));
    rows.push({t:'tog',label:'Gas sufficiente, riserve comprese',path:'inv.gasOn',th:'reserve'});
    return {title:'Tempo massimo',groups:[
      {head:'Vincoli',rows,foot:'Cerca il minuto di stacco più lontano che rispetta tutti i vincoli attivi, alla profondità del settore selezionato.'},
      {head:'Risultato',rows:[res].concat(r.t!=null?[{t:'act',label:'Usa questo tempo',run:()=>{const d=r.t-lvl().t;for(let j=S.act;j<S.levels.length;j++) S.levels[j].t+=d;save();closeSettings();toast('Minuto di stacco: '+r.t);}}]:[])}
    ]};}
  case 'exp':{const gs=[
    {rows:[{t:'tog',label:'Miscele con idrogeno',get:()=>S.h2exp,set:v=>{
      if(v) openConfirm({title:'Modalità sperimentale',text:'Le miscele con idrogeno sono state usate solo in immersioni sperimentali (COMEX, oltre 500 m). Nessun modello di decompressione è validato: il calcolo è un’estrapolazione da studio. Con più del '+S.h2cfg.o2max+'% di ossigeno l’idrogeno è esplosivo.',yes:'Attiva',onYes:()=>{S.h2exp=true;save();renderSettings();}});
      else{S.h2exp=false;for(const g of S.gases) g.h2=0;for(const l of S.levels) if(l.dil) l.dil.h2=0;}
    },th:'h2'}],
     foot:'In circuito aperto metti l’idrogeno nel gas di fondo: le stage di viaggio e deco le calcola Bathys. In CCR lo imposti nel diluente di un settore.'}];
    if(S.h2exp){
      gs.push({head:'Idrogeno',rows:[
        num('Ossigeno massimo con idrogeno','h2cfg.o2max','%',1,6,0,'h2'),
        num('Salto di O₂ al primo cambio','h2cfg.step','punti',1,4,0,'h2step'),
        num('Lavaggio dall’idrogeno','h2cfg.wash','min',0,60,0,'h2wash'),
        num('Stage da portare','h2cfg.stages','',1,6,0,'h2chain'),
        {t:'pick',label:'Bombola delle stage',opts:S.cyls.map(c=>[c.id,c.name]),get:()=>S.h2cfg.cyl,set:v=>{S.h2cfg.cyl=v;},th:'cyls'}]});
      if(isHydroOC(S)){const H=hydroChain(S), E=E0();gs.push({head:'Stage calcolate',rows:H.gases.filter(g=>g!==H.bot).map(g=>({t:'info',label:gasName(g),value:g.trans?'a '+H.dH2+' m, lavaggio':(g.role==='deco'?'deco da ':'viaggio da ')+Math.round(modOf(E,g,g.role==='deco'?S.lim.ppo2Deco:S.lim.ppo2Bottom))+' m',th:'h2chain'}))});}
    }
    return {title:'Sperimentale',groups:gs};}
  case 'pen': return {title:'Penetrazione',groups:[
    {rows:[{t:'tog',label:'Calcola il punto di inversione',path:'pen.on',th:'pen'}]},
    {head:'Regola',rows:[
      {t:'seg',label:'Gas per l’andata',opts:[[3,'1/3'],[4,'1/4'],[6,'1/6']],path:'pen.rule',th:'pen'},
      num('Velocità di pinneggiata','pen.speed','m/min',1,40,0,'pen')],
     foot:'Il risultato compare nella scheda Gas del piano.'}
  ]};
  case 'cont': return {title:'Contingenza',groups:[
    {rows:S.cont.list.map((c,i)=>({t:'link',label:'Scenario '+(i+1),value:dlt(c),to:'cnt|'+i,th:'cont'})).concat([{t:'act',label:'Aggiungi scenario',run:()=>{S.cont.list.push({dd:5,dt:5});save();go('cnt|'+(S.cont.list.length-1));}}]),
     foot:'Ogni scenario cambia profondità e minuti di stacco di tutti i settori. Nel piano trovi la tabella di confronto nella scheda Contingenza.'}]};
  case 'cnt':{const i=+P[1], c=S.cont.list[i];if(!c) return page('cont');
    return {title:'Scenario '+(i+1),groups:[{rows:[
      {t:'num',label:'Profondità',get:()=>c.dd,set:v=>{c.dd=v;},unit:'m',min:-50,max:60,dec:0,th:'cont'},
      {t:'num',label:'Tempo',get:()=>c.dt,set:v=>{c.dt=v;},unit:'min',min:-60,max:120,dec:0,th:'cont'}],foot:'Valori negativi per uno scenario più corto o meno profondo.'},
      {rows:S.cont.list.length>1?[{t:'act',label:'Elimina scenario',danger:true,run:()=>{S.cont.list.splice(i,1);S.cont.sel=0;save();back();}}]:[]}]};}
  case 'lvl':{const i=+P[1], l=S.levels[i];if(!l) return page('root');
    const gs=[{rows:[
      {t:'num',label:'Profondità',get:()=>l.d,set:v=>{l.d=v;},unit:'m',min:1,max:400,dec:0,th:'depth'},
      {t:'num',label:'Minuto di stacco',get:()=>l.t,set:v=>{setLevelTime(i,v);},unit:'min',min:timeMin(i),max:9999,dec:0,th:'time'}]}];
    if(S.mode==='ccr'){
      const E=E0(), bd=bestDil(E,S,l.d), dr=[{t:'tog',label:'Diluente diverso per questo settore',get:()=>!!l.dil,set:v=>{l.dil=v?{o2:bd.o2,he:bd.he,h2:bd.h2}:null;},th:'dilLevel'}];
      if(l.dil){
        const g=l.dil;
        dr.push({t:'num',label:'Ossigeno',get:()=>g.o2,set:v=>{g.o2=v;if(g.o2+g.he+(g.h2||0)>100) g.he=Math.max(0,100-g.o2-(g.h2||0));},unit:'%',min:1,max:100,dec:0,th:'dil'});
        dr.push({t:'num',label:'Elio',get:()=>g.he,set:v=>{g.he=Math.min(v,100-g.o2-(g.h2||0));},unit:'%',min:0,max:98,dec:0,th:'dil'});
        if(S.h2exp) dr.push({t:'num',label:'Idrogeno',get:()=>g.h2||0,set:v=>{g.h2=Math.min(v,100-g.o2-g.he);},unit:'%',min:0,max:98,dec:0,th:'h2'});
        dr.push({t:'info',label:'Flush a '+l.d+' m',value:'ppO₂ '+fmt(ppO2(E,g,l.d),2),th:'dil'});
        if((g.h2||0)>0&&l.d<bd.safe) dr.push({t:'alert',label:'PERICOLO DI MORTE: a '+l.d+' m il loop avrebbe '+fmt(S.ccr.spHigh/E.P(l.d)*100,1)+'% di ossigeno con idrogeno. Serve almeno '+Math.ceil(bd.safe)+' m.',th:'h2'});
      }
      dr.push({t:'act',label:'Usa il consigliato: '+gasName(bd),run:()=>{l.dil={o2:bd.o2,he:bd.he,h2:bd.h2};save();renderSettings();}});
      if(S.h2exp) dr.push({t:'info',label:'Idrogeno sicuro da',value:Math.ceil(bd.safe)+' m con setpoint '+fmt(S.ccr.spHigh,1),th:'h2'});
      gs.push({head:'Diluente',rows:dr,foot:'Senza un diluente proprio il settore usa quello principale. In risalita Bathys passa da solo a diluenti adatti, con le soste di cambio.'});
    }
    if(S.levels.length>1) gs.push({rows:[{t:'act',label:'Elimina settore',danger:true,run:()=>{S.levels.splice(i,1);S.act=Math.max(0,Math.min(S.act,S.levels.length-1));for(let k=1;k<S.levels.length;k++) if(S.levels[k].t<=S.levels[k-1].t) S.levels[k].t=S.levels[k-1].t+1;save();back();}}]});
    return {title:'Settore '+(i+1),groups:gs};}
  case 'env': return {title:'Ambiente',groups:[
    {head:'Acqua e quota',rows:[
      {t:'seg',label:'Acqua',opts:[['salt','Salata'],['fresh','Dolce']],path:'env.water',th:'water'},
      num('Altitudine','env.alt','m',0,5000,0,'alt',{step:50})]},
    {head:'Aspetto',rows:[
      {t:'seg',label:'Ambiente',opts:[['mare','Mare'],['lago','Lago'],['grotta','Grotta']],path:'env.theme',th:'theme'},
      {t:'seg',label:'Tema',opts:[['dark','Scuro'],['light','Chiaro'],['auto','Auto'],['night','Notte']],path:'env.look',th:'look'}]}
  ]};
  case 'about': return {title:'Avvertenze',groups:[{rows:[{t:'info',label:'Versione',value:APP_VERSION},{t:'act',label:'Cerca aggiornamenti',run:()=>checkUpdate(false)},{t:'info',label:'Dati',value:'solo su questo telefono'}],
    foot:'Bathys è un pianificatore da usare a terra, non un computer subacqueo. Le immersioni con decompressione, trimix e rebreather richiedono formazione specifica.'},
    {rows:[{t:'act',label:'Ripristina i valori predefiniti',danger:true,run:()=>openConfirm({title:'Ripristinare?',text:'Tutte le impostazioni, i gas, le bombole e i preset tornano ai valori iniziali.',yes:'Ripristina',onYes:()=>{S=defaults();S.seenIntro=true;save();closeSettings();toast('Valori predefiniti ripristinati');}})}]}]};
  }
  return page('root');
}
function snapshot(name){return {id:uid(),name,mode:S.mode,levels:deep(S.levels),gases:deep(S.gases),dil:deep(S.ccr.dil),bailout:deep(S.ccr.bailout),gf:[S.algo.gfLo,S.algo.gfHi]};}
function applyPreset(p){
  S.mode=p.mode;S.levels=deep(p.levels);S.act=0;
  if(p.gases&&p.gases.length) S.gases=deep(p.gases);
  if(p.dil) S.ccr.dil=deep(p.dil);
  if(p.bailout) S.ccr.bailout=deep(p.bailout);
  if(p.gf){S.algo.gfLo=p.gf[0];S.algo.gfHi=p.gf[1];}
  S.presetName=p.name;save();
}
function rowVal(r){
  const v=r.get?r.get():getP(r.path);
  if(r.t==='num') return fmt(v,r.dec)+(r.unit?' '+r.unit:'');
  return v;
}
function renderSettings(){
  const id=NAV[NAV.length-1], pg=page(id);
  $('#setTitle').textContent=pg.title;
  $('#setLeft').innerHTML=NAV.length>1?'<button class="pillbtn plain" type="button" id="setBack" aria-label="Indietro">‹</button>':'';
  if(NAV.length>1) $('#setBack').onclick=back;
  const body=$('#setBody');let h='';const acts=[];
  pg.groups.forEach((g,gi)=>{
    if(!g.rows||!g.rows.length) return;
    h+='<div class="grp">'+(g.head?'<h3>'+esc(g.head)+'</h3>':'')+'<div class="list">';
    g.rows.forEach((r,ri)=>{
      const k=gi+'_'+ri;acts.push([k,r]);
      const th=r.th?' data-th="'+r.th+'"':'';
      if(r.t==='link') h+='<button type="button" class="row" data-k="'+k+'"'+th+'><span class="l">'+esc(r.label)+'</span><span class="v">'+esc(r.value||'')+' ›</span></button>';
      else if(r.t==='num') h+='<button type="button" class="row" data-k="'+k+'"'+th+'><span class="l">'+esc(r.label)+'</span><span class="v">'+esc(rowVal(r))+'</span></button>';
      else if(r.t==='text') h+='<button type="button" class="row" data-k="'+k+'"><span class="l">'+esc(r.label)+'</span><span class="v">'+esc(r.get())+' ›</span></button>';
      else if(r.t==='info') h+='<div class="row"'+th+' style="cursor:default"><span class="l">'+esc(r.label)+'</span><span class="v">'+esc(r.value)+'</span></div>';
      else if(r.t==='tog'){const on=!!(r.get?r.get():getP(r.path));h+='<div class="row"'+th+'><span class="l">'+esc(r.label)+'</span><button type="button" class="toggle" role="switch" aria-checked="'+on+'" aria-label="'+esc(r.label)+'" data-k="'+k+'"></button></div>';}
      else if(r.t==='seg'){const cur=r.get?r.get():getP(r.path);h+='<div class="row segrow"'+th+' style="cursor:default"><span class="l">'+esc(r.label)+'</span><div class="seg small glass" role="group" aria-label="'+esc(r.label)+'">'+r.opts.map(o=>'<button type="button" data-k="'+k+'" data-v="'+o[0]+'" aria-pressed="'+(String(cur)===String(o[0]))+'">'+esc(o[1])+'</button>').join('')+'</div></div>';}
      else if(r.t==='pick'){const cur=r.get();const nm=(r.opts.find(o=>o[0]===cur)||['',''])[1];h+='<button type="button" class="row" data-k="'+k+'"'+th+'><span class="l">'+esc(r.label)+'</span><span class="v">'+esc(nm)+' ›</span></button>';}
      else if(r.t==='alert') h+='<div class="row alert"'+th+'><span>'+esc(r.label)+'</span></div>';
      else if(r.t==='act') h+='<button type="button" class="row '+(r.danger?'danger':'act')+'" data-k="'+k+'">'+esc(r.label)+'</button>';
    });
    h+='</div>'+(g.foot?'<p class="gfoot">'+esc(g.foot)+'</p>':'')+'</div>';
  });
  body.innerHTML=h;
  const map=Object.fromEntries(acts);
  body.querySelectorAll('[data-k]').forEach(el=>{
    const r=map[el.dataset.k];
    el.addEventListener('click',()=>{
      if(el._long) return;
      if(r.t==='link') go(r.to);
      else if(r.t==='num') openNumber({title:r.label,unit:r.unit,value:r.get?r.get():getP(r.path),min:r.min,max:r.max,dec:r.dec,step:r.step,th:r.th,onOk:v=>{r.set?r.set(v):setP(r.path,v);afterEdit();}});
      else if(r.t==='text') openText({title:r.label,value:r.get(),onOk:v=>{r.set(v);afterEdit();}});
      else if(r.t==='tog'){const v=!(r.get?r.get():getP(r.path));r.set?r.set(v):setP(r.path,v);afterEdit();}
      else if(r.t==='seg'){let v=el.dataset.v;const o=r.opts.find(x=>String(x[0])===v);if(o) v=o[0];r.set?r.set(v):setP(r.path,v);afterEdit();}
      else if(r.t==='pick') openPick(r);
      else if(r.t==='act') r.run();
    });
  });
  attachLong(body);
}
function afterEdit(){
  if(S.algo.gfHi<S.algo.gfLo) S.algo.gfHi=S.algo.gfLo;
  if(S.ccr.dil.o2+S.ccr.dil.he>100) S.ccr.dil.he=100-S.ccr.dil.o2;
  save();renderSettings();applyLook();
}
function openPick(r){
  const cur=r.get();
  openMini('<h2 class="serif">'+esc(r.label)+'</h2><div class="list glass" style="margin-top:8px">'+r.opts.map(o=>'<button type="button" class="row" data-v="'+esc(o[0])+'"><span class="l">'+esc(o[1])+'</span><span class="check" aria-hidden="true">'+(o[0]===cur?'✓':'')+'</span></button>').join('')+'</div><div class="btns" style="grid-template-columns:1fr"><button class="sec" type="button" id="pkC">Annulla</button></div>');
  $('#miniBody').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{r.set(b.dataset.v);closeMini();afterEdit();});
  $('#pkC').onclick=closeMini;
}

/* ---------- theory ---------- */
const THEORY={
  model:['Bühlmann ZHL-16C','Il modello divide il corpo in 16 compartimenti teorici, con tempi di emisaturazione che vanno da pochi minuti a oltre dieci ore, calcolati separatamente per azoto ed elio. Per ognuno stabilisce quanta sovrassaturazione può tollerare: è il valore M.','Il planner usa la variante con il primo compartimento a 5 minuti, la stessa di Subsurface. I gradient factors riducono i valori M per renderlo più conservativo.','Oltre i 150 m circa ZHL-16C lavora fuori dai dati su cui è stato costruito. Nemmeno VPM-B è più affidabile a quelle quote: entrambi sono estrapolazioni, e lì contano molto l’esperienza e i protocolli di chi fa immersioni del genere.'],
  depth:['Profondità','La profondità del settore, in metri. Puoi trascinare la rotellina: più veloce scorri, più grandi diventano i salti. Toccando il numero lo scrivi a mano.','Le tacche in ambra indicano dove il gas di fondo supera la ppO₂ massima, l’END massima o la densità massima.'],
  time:['Minuto di stacco','È il minuto totale dell’immersione in cui lasci quella profondità, discesa compresa. Con 60 m e minuto 20, a 20 m/min arrivi sul fondo al minuto 3 e ci resti 17 minuti.','Nei settori successivi vale lo stesso: il minuto di stacco deve essere dopo quello del settore precedente.'],
  gfLo:['GF basso','Il GF basso decide dove inizia la decompressione: è la percentuale del valore M ammessa alla prima sosta. Più è basso, più profonda è la prima sosta.','Uno studio della marina americana (NEDU, 2011) ha trovato più casi di MDD con profili a soste profonde rispetto a profili con soste più basse a parità di tempo totale. Da allora molti subacquei tecnici hanno alzato il GF basso, spesso tra 40 e 60.'],
  gfHi:['GF alto','La percentuale del valore M ammessa all’emersione. Tra la prima sosta e la superficie il GF sale in linea retta dal basso all’alto.','Abbassarlo allunga le soste basse, quelle dove si elimina gran parte del gas lento. Valori comuni nel tecnico: da 70 a 85.'],
  stopInt:['Intervallo tra le soste','La distanza tra una sosta e l’altra. Le soste cadono sui multipli di questo valore: con 3 m sono a 6, 9, 12 m e così via.'],
  lastStop:['Ultima sosta','La profondità dell’ultima sosta prima di emergere.','6 m è comodo con mare mosso e sfrutta meglio l’ossigeno puro, respirabile lì a circa 1,6 bar. 3 m accorcia la deco totale, ma la quota è più difficile da tenere con onda.','Con i gradient factors l’ultima sosta è spesso la più lunga, perché l’emersione deve rispettare il GF alto.'],
  switchTime:['Durata del cambio gas','Minuti di sosta aggiunti quando cambi gas: servono per trovare la bombola giusta, verificare l’etichetta, aprire il rubinetto e controllare che respiri bene. Il cambio avviene sulle profondità delle soste.'],
  desc:['Velocità di discesa','Una discesa più rapida accorcia il tempo in cui i tessuti assorbono gas durante il viaggio, ma aumenta lo sforzo e la narcosi improvvisa.','Con miscele molto ricche di elio, sotto i 150 m circa, una compressione rapida favorisce la sindrome nervosa da alte pressioni (HPNS): a quelle quote si scende più piano.'],
  asc:['Risalita fino alla prima sosta','La velocità dal fondo alla prima sosta. 9–10 m/min è lo standard della maggior parte delle didattiche.'],
  stops:['Tra le soste','La velocità tra una sosta e l’altra. Più lenta allunga leggermente il tempo totale ma rende il profilo più dolce.'],
  surf:['Dall’ultima sosta alla superficie','L’ultimo tratto ha il salto di pressione relativo più grande di tutta l’immersione: da 6 m a 0 la pressione scende del 37%. Per questo si risale lentamente, 1–3 m/min.'],
  gases:['Gas','La lista dei gas per il circuito aperto. Ogni gas ha un ruolo: fondo, viaggio o deco.','In discesa respiri il gas di fondo appena è respirabile; prima usi un gas da viaggio. In risalita il planner passa sempre al gas più ricco di ossigeno che rispetta i limiti.'],
  role:['Ruolo del gas','Fondo: il gas respirato sul fondo.','Viaggio: per i tratti dove il gas di fondo non va bene, per esempio in superficie e nei primi metri con un ipossico come 10/70, o per ridurre la deco a quote intermedie.','Deco: usato solo in risalita, dalla sua profondità di cambio in su, con la ppO₂ massima di deco.'],
  sw:['Profondità di cambio','In automatico il cambio avviene sulla prima sosta dove la ppO₂ non supera il limite, con una tolleranza di 0,03 bar per gli arrotondamenti: così l’ossigeno puro risulta utilizzabile a 6 m.','Puoi forzare una profondità a mano, per esempio per seguire una procedura di squadra. Il planner avvisa se la ppO₂ a quella quota supera il limite.'],
  mod:['MOD','Massima profondità operativa: la profondità in cui il gas raggiunge la ppO₂ massima impostata. Si calcola come ppO₂ massima diviso frazione di ossigeno, meno la pressione in superficie, diviso la pressione per metro.'],

  ppo2Bottom:['ppO₂ massima sul fondo','La pressione parziale massima di ossigeno durante la discesa e il fondo. 1,4 bar è il limite più usato per la fase di lavoro; per immersioni lunghe o faticose molti scendono a 1,2–1,3.','Il rischio è la tossicità acuta sul sistema nervoso centrale, che può dare convulsioni senza preavviso.'],

  o2Narc:['Ossigeno narcotico','Se attivo, l’ossigeno conta come narcotico quanto l’azoto: è la scelta prudente e lo standard di molte didattiche tecniche. Se spento conta solo l’azoto, e l’END risulta più bassa.'],

  spLow:['Setpoint basso','Il setpoint usato in superficie e in discesa. Vicino alla superficie un setpoint alto non si può raggiungere, perché la pressione ambiente è circa 1 bar, e il rebreather inietterebbe ossigeno di continuo. In discesa, poi, la compressione fa salire la ppO₂ da sola: per questo si parte bassi, di solito 0,7.'],
  spSwitch:['Cambio al setpoint alto','La profondità in cui passi al setpoint alto durante la discesa. Se il fondo è meno profondo, il passaggio avviene all’inizio del fondo.'],
  spHigh:['Setpoint alto','Il setpoint di fondo e risalita. Più alto significa meno gas inerte nel loop e meno decompressione, ma più dose di ossigeno (CNS e OTU).'],

  mode:['Circuito aperto o CCR','In circuito aperto ogni respiro esce in acqua e la miscela inspirata è quella della bombola. In CCR il gas ricircola, la CO₂ viene assorbita dalla calce e l’elettronica tiene la ppO₂ al setpoint: il gas inerte cambia con la profondità.'],

  cns:['CNS','La dose di ossigeno per il sistema nervoso centrale, in percentuale del limite NOAA. Sopra l’80% conviene ridurre la ppO₂ o il tempo; il 100% è il limite.'],
  otu:['OTU','Unità di tossicità polmonare dell’ossigeno. Un riferimento comune è non superare 300 OTU in una giornata.'],
  h2:['Idrogeno (sperimentale)','Le miscele con idrogeno, hydrox (ossigeno e idrogeno) e hydreliox (ossigeno, elio e idrogeno), sono state usate in immersioni sperimentali: la COMEX con Hydra VIII nel 1988 raggiunse 534 m in mare, e Hydra X nel 1992 simulò 701 m in camera iperbarica.','L’idrogeno è il gas più leggero: abbassa molto la densità della miscela e attenua la sindrome nervosa da alte pressioni. È però narcotico, circa metà dell’azoto, e soprattutto con più del 4% circa di ossigeno forma una miscela infiammabile ed esplosiva. Per questo si respira solo molto in profondità, dove anche l’1–3% di ossigeno basta, e servono gas di transito in discesa e in risalita.','Bühlmann non ha coefficienti per l’idrogeno. Qui i tempi di emisaturazione sono stimati dalla legge di Graham (√ della massa molecolare) e i coefficienti a e b sono quelli dell’elio. È un’estrapolazione senza alcuna validazione: serve per studiare, non per immergersi.'],
  simpLast:['Ultima sosta','La profondità dell’ultima sosta nel piano semplificato. Anche con soste ogni 9 m puoi fermarti per l’ultima a 5 o 6 m, dove l’ossigeno puro lavora meglio.'],
  warnPage:['Avvisi','Ogni avviso si attiva o si spegne e ha i suoi valori. Spegnere un avviso non cambia il calcolo: smetti solo di vederlo. Restano sempre attivi gas insufficiente, settori impossibili e miscele con idrogeno esplosive.'],
  dilLevel:['Diluente per settore','In CCR puoi cambiare diluente da un settore all’altro, per esempio un 10/70 sul fondo profondo e un 18/45 al settore successivo. Il consigliato ha una ppO₂ di flush intorno a 1,1 alla profondità del settore, e l’elio che serve per END e densità.','In risalita, se il diluente non va più bene alla quota successiva, Bathys inserisce un cambio con una sosta.'],
  h2step:['Salto di O₂ al primo cambio','Quando lasci l’idrogeno, il primo gas ha poco più ossigeno di quello di fondo, per esempio dal 2 al 4%. Nei polmoni resta idrogeno per qualche minuto: se arrivasse subito un gas ricco di ossigeno, la miscela nei polmoni e negli erogatori potrebbe diventare infiammabile.'],
  h2wash:['Lavaggio dall’idrogeno','I minuti che resti sul gas di transizione, senza idrogeno e con poco ossigeno, prima di passare a miscele più ricche. Vale anche in discesa: arrivi sull’idrogeno solo dopo il lavaggio.'],
  h2chain:['Stage per l’idrogeno','Con un gas di fondo all’idrogeno Bathys ignora gli altri gas e calcola da solo le stage: prima un heliox di transizione con un piccolo salto di ossigeno, poi miscele scelte per ppO₂, END e densità, distribuite tra la profondità di cambio e l’ultima sosta. Tu scegli il gas di fondo, quante bombole e quante stage portare.'],
  simpInt:['Intervallo tra le soste','Allarga la distanza tra le soste, per esempio ogni 5 o 6 m invece di 3. Il piano viene ricalcolato con il modello: meno soste da ricordare, ma ogni sosta un po’ più lunga. L’ultima sosta si adatta al nuovo intervallo.'],
  simpRed:['Soste in meno','Toglie una parte delle soste, partendo da quelle che costano meno, e allunga quelle che restano quanto serve perché ogni risalita rispetti il modello. Le soste di cambio gas restano sempre. Più soste togli, più cresce il tempo totale.'],
  simpRound:['Durate tonde','Arrotonda le soste per eccesso a multipli di 2 minuti, e di 5 sopra i 10 minuti: più facili da ricordare e da cronometrare.'],
  fork:['Scenari della mappa','Nella vista metro ogni colonna è uno scenario: A con tutti i gas, le altre se perdi uno o più gas di viaggio o deco. Ogni colonna parte dal punto in cui si separa dalla linea da cui deriva, con tutte le soste e i cambi successivi. Il colore della linea è il gas respirato; i cerchi doppi sono cambi gas; i numeri sono i minuti di runtime.'],
  dual:['Verificato','Ogni piano viene calcolato da due motori scritti in modo indipendente. Il primo integra i tessuti a piccoli passi, il secondo usa l’equazione di Schreiner con tabelle proprie.','Se il runtime differisce di più di un minuto e mezzo, o una sosta di più di un minuto, il piano viene segnalato: vuol dire che uno dei due ha un errore e non va usato finché non si capisce quale.'],
  inv:['Tempo massimo','È il piano a ritroso: invece di dire quanto resti e scoprire la deco, fissi i vincoli e l’app trova il minuto di stacco più lontano che li rispetta tutti. Per esempio la barca che torna a un’ora precisa, una deco non oltre un’ora, il CNS sotto l’80% o il gas che basta con le riserve.','Se ci sono settori successivi, si spostano in avanti della stessa quantità.'],
  icd:['Controdiffusione isobarica','Quando passi da una miscela ricca di elio a una ricca di azoto, i due gas si muovono a velocità diverse tra i tessuti: l’elio esce in fretta, l’azoto entra più lento. Nell’orecchio interno questo può creare bolle anche senza cambiare profondità.','La regola dei quinti, proposta da Steve Burton, dice che al cambio l’aumento della percentuale di azoto non dovrebbe superare un quinto della diminuzione di elio. È prudente: molti protocolli accettano il passaggio da trimix a EAN50 a 21 m, che la regola segnala. Se ti disturba puoi spegnere l’avviso nei limiti.'],
  trim:['Assetto','Ogni litro di gas pesa: l’aria circa 1,2 grammi al litro, l’elio un settimo. Respirando migliaia di litri diventi più leggero di qualche chilo, e le bombole in alluminio a fine immersione tendono a galleggiare.','Il calcolo considera solo il peso del gas. Per la zavorra giusta aggiungi la spinta delle bombole vuote, che trovi nelle schede del produttore.'],
  pen:['Penetrazione','In grotta o in relitto il gas non si conta solo per la risalita ma per uscire. Con la regola dei terzi usi un terzo per entrare, un terzo per uscire e un terzo resta per il compagno o gli imprevisti. Con flusso a favore all’andata si usano regole più strette, come 1/4 o 1/6.','In circuito aperto il punto di inversione è il tempo in cui consumi la tua quota d’andata. In CCR è il tempo per cui il bailout basta a uscire da solo sotto stress. Moltiplicato per la velocità di pinneggiata dà i metri di sagola.'],
  about:['Avvertenze','Bathys è un pianificatore, non un computer subacqueo.']
};

/* ---------- init ---------- */
initWheels();
renderAllHome();
applyLook();
if(!S.seenIntro||!S.tutDone) setTimeout(openWelcome,400);
async function checkUpdate(silent){
  const sw=navigator.serviceWorker;
  if(!sw||!sw.controller){if(!silent) toast('Gli aggiornamenti funzionano nell’app installata da GitHub');return;}
  try{
    const r=await fetch('index.html?v='+Date.now(),{cache:'no-store'});
    const t=await r.text(), m=t.match(/const APP_VERSION='([^']+)'/), v=m?m[1]:null;
    if(v&&v!==APP_VERSION){
      openConfirm({title:'Aggiornamento disponibile',text:'C’è la versione '+v+' (hai la '+APP_VERSION+'). Le tue impostazioni restano.',yes:'Aggiorna',onYes:async()=>{
        try{const reg=await sw.getRegistration();if(reg) await reg.update();const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}catch(e){}
        location.reload();
      }});
    }else if(!silent) toast('Hai già l’ultima versione ('+APP_VERSION+')');
  }catch(e){if(!silent) toast('Nessuna connessione: riprova più tardi');}
}
setTimeout(()=>checkUpdate(true),4000);
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window&&!/claude\.ai|claudeusercontent/.test(location.host)) navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
$('#btnInfo').onclick=openHelp;$('#planInfo').onclick=openHelp;$('#setInfo').onclick=openHelp;
$('#cskip').onclick=endTour;$('#cprev').onclick=()=>{if(TOUR&&TOUR.i>0){TOUR.i--;showStep();}};$('#cnext').onclick=()=>{if(!TOUR) return;if(TOUR.i<TOUR.steps.length-1){TOUR.i++;showStep();}else endTour();};
window.addEventListener('resize',()=>{if(TOUR) placeStep();});
