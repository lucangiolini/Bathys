<!doctype html>
<html lang="it" data-look="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06223A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bathys">
<title>Bathys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  --ink:#0B1F2E;--ink2:#36505F;--glass:rgba(255,255,255,.56);--glass2:rgba(255,255,255,.8);--stroke:rgba(255,255,255,.9);
  --line:rgba(11,31,46,.1);--sh:inset 0 1px 0 rgba(255,255,255,.9),0 10px 30px rgba(11,31,46,.12);
  --warn:#8A4B00;--warnbg:rgba(255,170,60,.24);--err:#A3261B;--errbg:rgba(220,60,40,.14);
  --cta:#0B3A5C;--ctaink:#FFFFFF;--sel:rgba(255,255,255,.95);--sheet:rgba(236,243,247,.82);--scrim:rgba(11,31,46,.28);
  --base:#DCE7EC;color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#FFFFFF;--ink2:rgba(255,255,255,.82);--glass:rgba(255,255,255,.10);--glass2:rgba(255,255,255,.17);--stroke:rgba(255,255,255,.22);
    --line:rgba(255,255,255,.13);--sh:inset 0 1px 0 rgba(255,255,255,.35),0 14px 36px rgba(0,0,0,.28);
    --warn:#FFC46B;--warnbg:rgba(255,176,64,.18);--err:#FF9B8F;--errbg:rgba(255,90,70,.18);
    --cta:rgba(255,255,255,.93);--ctaink:#06223A;--sel:rgba(255,255,255,.26);--sheet:rgba(10,26,42,.64);--scrim:rgba(0,0,0,.4);
    --base:#06223A;color-scheme:dark;
  }
}
:root[data-theme="dark"],:root[data-look="dark"]{
  --ink:#FFFFFF;--ink2:rgba(255,255,255,.82);--glass:rgba(255,255,255,.10);--glass2:rgba(255,255,255,.17);--stroke:rgba(255,255,255,.22);
  --line:rgba(255,255,255,.13);--sh:inset 0 1px 0 rgba(255,255,255,.35),0 14px 36px rgba(0,0,0,.28);
  --warn:#FFC46B;--warnbg:rgba(255,176,64,.18);--err:#FF9B8F;--errbg:rgba(255,90,70,.18);
  --cta:rgba(255,255,255,.93);--ctaink:#06223A;--sel:rgba(255,255,255,.26);--sheet:rgba(10,26,42,.64);--scrim:rgba(0,0,0,.4);
  --base:#06223A;color-scheme:dark;
}
:root[data-look="light"]{
  --ink:#0B1F2E;--ink2:#36505F;--glass:rgba(255,255,255,.56);--glass2:rgba(255,255,255,.8);--stroke:rgba(255,255,255,.9);
  --line:rgba(11,31,46,.1);--sh:inset 0 1px 0 rgba(255,255,255,.9),0 10px 30px rgba(11,31,46,.12);
  --warn:#8A4B00;--warnbg:rgba(255,170,60,.24);--err:#A3261B;--errbg:rgba(220,60,40,.14);
  --cta:#0B3A5C;--ctaink:#FFFFFF;--sel:rgba(255,255,255,.95);--sheet:rgba(236,243,247,.82);--scrim:rgba(11,31,46,.28);
  --base:#DCE7EC;color-scheme:light;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#miniBody img{-webkit-touch-callout:default}
html,body{height:100%;margin:0}
body{background:var(--base);color:var(--ink);font-family:'Geist',-apple-system,BlinkMacSystemFont,'Helvetica Neue',system-ui,sans-serif;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:12px}
.serif{font-family:'Instrument Serif','Iowan Old Style',Georgia,serif;font-weight:400}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--stroke);box-shadow:var(--sh)}

/* water */
#water{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--water,#0B3A5C);transition:background-color .35s}
#water .ray{position:absolute;top:-15%;height:85%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));filter:blur(14px);transform-origin:top center}
#rays{position:absolute;inset:0;opacity:var(--rays,.3);transition:opacity .35s}
#water .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob,.3);transition:opacity .35s}
#torch{position:absolute;inset:0;opacity:0;background:radial-gradient(circle 190px at var(--tx,50%) var(--ty,40%),rgba(255,236,200,.24),rgba(255,236,200,.07) 55%,transparent 72%);transition:opacity .3s}
#motes{position:absolute;inset:0;opacity:var(--motes,0);transition:opacity .6s}
.mote{position:absolute;width:3px;height:3px;border-radius:50%;background:#7FF5E4;box-shadow:0 0 8px 2px rgba(110,240,220,.6);animation:drift var(--dur,14s) ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0);opacity:.2}50%{opacity:1}to{transform:translate(var(--dx,20px),var(--dy,-40px));opacity:.3}}
@media (prefers-reduced-motion: reduce){.mote{animation:none}#water{transition:none}}

/* layout */
#app{position:relative;z-index:1;height:100%;max-width:470px;margin:0 auto}
#home{height:100%;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;padding:16px 18px 6px;scrollbar-width:none}
#home::-webkit-scrollbar{display:none}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:48px;line-height:.95;letter-spacing:-.01em}
.preset{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:4px 0;border:0;background:none;color:var(--ink2);font-size:14px;cursor:pointer;min-height:32px}
.round{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;cursor:pointer;flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:22px}
.seg button{min-height:38px;border:1px solid transparent;border-radius:18px;background:transparent;color:var(--ink2);font-size:15px;font-weight:500;cursor:pointer;transition:background .2s}
.seg button[aria-pressed="true"]{background:var(--sel);border-color:var(--stroke);color:var(--ink);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.seg.small{border-radius:12px;padding:3px}
.seg.small button{min-height:32px;border-radius:9px;font-size:14px;padding:0 10px}

/* wheels */
.wheels{position:relative;border-radius:30px;padding:12px 8px 10px}
.wgrid{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.wlab{text-align:center;font-size:13px;color:var(--ink2);padding-bottom:2px}
.band{position:absolute;left:4px;right:4px;top:calc(50% - 25px);height:50px;border-radius:17px;background:var(--glass2);border:1px solid var(--stroke);pointer-events:none}
.wheel{position:relative;height:var(--wh,214px);touch-action:none;cursor:ns-resize;perspective:460px;-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);user-select:none;-webkit-user-select:none;border-radius:16px}
.wi{position:absolute;left:0;right:0;top:50%;height:48px;margin-top:-24px;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',Georgia,serif;font-size:42px;line-height:1;will-change:transform}
.wi.warn{color:var(--warn)}
.wunit{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--ink2);pointer-events:none}
.whint{margin:6px 0 0;text-align:center;font-size:12px;color:var(--ink2)}

.lvls{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.lvls::-webkit-scrollbar{display:none}
.lchip{flex:none;display:flex;align-items:baseline;gap:6px;min-height:44px;padding:6px 14px;border-radius:22px;cursor:pointer;color:var(--ink);font-size:14px}
.lchip .serif{font-size:22px}
.lchip[aria-pressed="true"]{background:var(--glass2);outline:1.5px solid var(--ink);outline-offset:-1.5px}
.lchip.ghost{background:transparent;box-shadow:none;border-style:dashed;color:var(--ink2);align-items:center;line-height:1}
.modeline{display:inline-flex;align-items:center;gap:6px;margin-top:8px;min-height:30px;padding:3px 12px;border-radius:15px;border:1px solid var(--stroke);background:var(--glass);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;max-width:100%}
.modeline b{font-weight:600}
.modeline .gdot{flex:none;width:10px;height:10px;border-radius:5px;background:var(--g1)}
.modeline{border-left:3px solid var(--g1)}
.modeline span{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;min-height:30px;padding:4px 11px;border-radius:15px;background:var(--glass);border:1px solid var(--stroke);font-size:13px}
.pill.warn{background:var(--warnbg);border-color:transparent;color:var(--warn)}
.pill.err{background:var(--errbg);border-color:transparent;color:var(--err)}
.list{border-radius:24px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:50px;padding:6px 18px;border:0;background:transparent;text-align:left;cursor:pointer;color:var(--ink);font-size:16px;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row .v{color:var(--ink2);text-align:right;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l{flex:none;max-width:62%}
.row .sub{display:block;font-size:13px;color:var(--ink2);margin-top:1px}
.row.danger{color:var(--err);justify-content:center}
.row.act{color:var(--ink);font-weight:600;justify-content:center}
.live{margin:0;display:flex;align-items:baseline;justify-content:center;gap:8px;min-height:36px;color:var(--ink2);font-size:15px}
.live .serif{font-size:34px;color:var(--ink);line-height:1}
.cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:28px;background:var(--cta);color:var(--ctaink);font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.grab{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:8px 0 10px;border:0;background:none;color:var(--ink2);font-size:13px;cursor:pointer;touch-action:none}
.grab i{display:block;width:40px;height:5px;border-radius:3px;background:currentColor;opacity:.6}

/* plan page */
.page{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;max-width:470px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 0 env(safe-area-inset-bottom,0px);transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.page.open{transform:none;visibility:visible}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px}
.back{display:flex;align-items:center;min-height:42px;padding:0 16px;border-radius:21px;cursor:pointer;font-size:15px}
.ctx{font-size:13px;color:var(--ink2);text-align:right}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin:12px 18px 0;padding:4px;border-radius:22px}
.tabs button{min-height:36px;min-width:0;padding:0 4px;border:1px solid transparent;border-radius:18px;background:transparent;color:var(--ink2);font-size:13.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button[aria-selected="true"]{background:var(--sel);border-color:var(--stroke);color:var(--ink);font-weight:600}
.pager{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:10px}
.pager::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:4px 18px 28px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.pg::-webkit-scrollbar{display:none}
.big{display:flex;align-items:flex-end;justify-content:space-between}
.big .lab{display:block;font-size:13px;color:var(--ink2)}
.big .num{display:block;font-size:68px;line-height:.95}
.big .r{text-align:right}
.big .it{font-style:italic}
.card{border-radius:26px;padding:14px 16px}
.warns{display:flex;flex-direction:column;gap:6px}
.wline{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:16px;font-size:14px;background:var(--warnbg);color:var(--warn)}
.wline.err{background:var(--errbg);color:var(--err)}
.wline.info{background:var(--glass);color:var(--ink2);border:1px solid var(--stroke)}
.wline b{font-weight:600;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-weight:400;font-size:12px;color:var(--ink2);text-align:right;padding:4px 0 6px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:8px 0;border-top:1px solid var(--line)}
.tbl tr.sw td{color:var(--warn)}
.tbl tr.lvl td{font-weight:600}
.chart svg{display:block;width:100%;height:auto}
.foot{font-size:12px;color:var(--ink2);text-align:center;margin:4px 8px 0}
.gasc{display:flex;gap:14px;align-items:center}
.gasc svg{flex:none}
.gasc .t{font-size:17px;font-weight:600}
.gasc .d{font-size:14px;color:var(--ink2);margin-top:2px}
.gasc .w{font-size:13px;color:var(--warn);margin-top:3px}
.gasc .e{font-size:13px;color:var(--err);margin-top:3px}
.empty{padding:28px 10px;text-align:center;color:var(--ink2)}

/* sheets */
#scrim{position:fixed;inset:0;z-index:8;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-width:470px;margin:0 auto;border-radius:32px 32px 0 0;background:var(--sheet);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border-top:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 -20px 50px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet.tall{height:calc(100% - env(safe-area-inset-top,0px) - 34px)}
.shandle{display:flex;justify-content:center;padding:10px 0 4px;touch-action:none;cursor:grab}
.shandle i{display:block;width:40px;height:5px;border-radius:3px;background:var(--ink2);opacity:.6}
.shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:2px 14px 8px}
.shead h2{margin:0;font-size:30px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead .left{justify-self:start}.shead .right{justify-self:end}
.pillbtn{display:flex;align-items:center;min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--stroke);background:var(--glass2);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer}
.pillbtn.plain{font-weight:500}
.sbody{flex:1;overflow-y:auto;padding:4px 16px 26px;scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
.grp{margin-top:18px}
.grp h3{margin:0 6px 6px;font-size:14px;font-weight:500;color:var(--ink2)}
.grp .list{background:var(--glass);border:1px solid var(--stroke)}
.gfoot{margin:6px 8px 0;font-size:13px;color:var(--ink2)}
.toggle{position:relative;flex:none;width:51px;height:31px;border-radius:16px;border:0;background:rgba(120,130,140,.35);cursor:pointer;padding:0}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .2s}
.toggle[aria-checked="true"]{background:#248A3D}
.toggle[aria-checked="true"]::after{left:22px}
.mini{padding:16px 18px 10px}
.mini h2{margin:0 0 4px;font-size:30px}
.mini .hint{margin:0 0 12px;font-size:14px;color:var(--ink2)}
.numrow{display:flex;align-items:center;gap:10px}
.numrow input,.mini input[type=text]{flex:1;min-width:0;height:64px;border-radius:20px;border:1px solid var(--stroke);background:var(--glass2);color:var(--ink);font-family:'Instrument Serif',Georgia,serif;font-size:40px;text-align:center;padding:0 12px}
.mini input[type=text]{font-family:'Geist',system-ui,sans-serif;font-size:20px;height:54px;text-align:left;width:100%}
.stepb{flex:none;width:56px;height:56px;border-radius:28px;border:1px solid var(--stroke);background:var(--glass2);font-size:26px;cursor:pointer;color:var(--ink)}
.mini .unit{font-size:15px;color:var(--ink2);flex:none}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.btns .cta{min-height:52px;box-shadow:none}
.btns .sec{min-height:52px;border-radius:26px;border:1px solid var(--stroke);background:var(--glass2);font-size:16px;cursor:pointer;color:var(--ink)}
.theory{font-size:16px;line-height:1.55}
.theory p{margin:0 0 12px;max-width:64ch}
.err-msg{margin:8px 2px 0;font-size:14px;color:var(--err);min-height:18px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:20;transform:translate(-50%,30px);opacity:0;padding:10px 18px;border-radius:20px;font-size:14px;pointer-events:none;transition:all .25s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.check{width:20px;text-align:center;flex:none}

/* overlays: one blurred, darkened layer behind any sheet; sheets themselves don't blur */
:root{--scrimbg:rgba(20,35,50,.4);--sheet2:rgba(242,246,249,.93);--pagebg:rgba(255,255,255,.2);--tog:#248A3D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--scrimbg:rgba(2,10,20,.58);--sheet2:rgba(12,30,48,.88);--pagebg:rgba(2,12,24,.42)}}
:root[data-theme="dark"],:root[data-look="dark"]{--scrimbg:rgba(2,10,20,.58);--sheet2:rgba(12,30,48,.88);--pagebg:rgba(2,12,24,.42)}
:root[data-look="light"]{--scrimbg:rgba(20,35,50,.4);--sheet2:rgba(242,246,249,.93);--pagebg:rgba(255,255,255,.2)}
:root[data-look="night"]{--ink:#FF5A4A;--ink2:rgba(255,104,88,.82);--glass:rgba(255,60,40,.07);--glass2:rgba(255,60,40,.14);--stroke:rgba(255,80,60,.24);--line:rgba(255,80,60,.16);--sh:none;--warn:#FFA07A;--warnbg:rgba(255,120,60,.14);--err:#FF3B30;--errbg:rgba(255,40,30,.16);--cta:#E0352B;--ctaink:#000000;--sel:rgba(255,80,60,.2);--base:#000000;--scrimbg:rgba(0,0,0,.66);--sheet2:rgba(16,0,0,.94);--pagebg:rgba(0,0,0,.35);--tog:#B3261E;color-scheme:dark}
:root[data-look="night"] .toggle{background:rgba(255,80,60,.18)}
:root[data-look="night"] .toggle[aria-checked="true"]{background:var(--tog)}
:root[data-look="night"] .toggle::after{background:#2A0503}
.toggle[aria-checked="true"]{background:var(--tog)}
#scrim{background:var(--scrimbg);-webkit-backdrop-filter:blur(26px) saturate(130%);backdrop-filter:blur(26px) saturate(130%);visibility:hidden;transition:opacity .22s,visibility 0s .22s}
#scrim.on{visibility:visible;transition:opacity .22s}
.sheet{background:var(--sheet2);-webkit-backdrop-filter:none;backdrop-filter:none;will-change:transform}
#settings{transition:transform .34s cubic-bezier(.2,.8,.2,1),filter .2s}
#settings.behind{filter:brightness(.45) blur(2px)}
body.over #home .glass,body.over .page .glass{-webkit-backdrop-filter:none;backdrop-filter:none}
.page{background:var(--pagebg)}
#home{transition:opacity .2s}
body.plan #home{opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
:root{--g1:#1F6FB2;--g2:#6B4BC8;--g3:#9A5A00;--g4:#0E8A63;--g5:#B23A2E;--g6:#55626B;--okc:#1D7A3A;--okbg:rgba(40,160,80,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g1:#7CC8FF;--g2:#C3A6FF;--g3:#FFC46B;--g4:#7FF5C8;--g5:#FF9B8F;--g6:#E9EEF2;--okc:#8FF0B0;--okbg:rgba(80,220,130,.16)}}

<script>
'use strict';
const APP_VERSION='0.9.1';
/* ===== ENGINE START ===== */
const N2HT=[5.0,8.0,12.5,18.5,27.0,38.3,54.3,77.0,109.0,146.0,187.0,239.0,305.0,390.0,498.0,635.0];
const N2A=[1.1696,1.0,0.8618,0.7562,0.6200,0.5043,0.4410,0.4000,0.3750,0.3500,0.3295,0.3065,0.2835,0.2610,0.2480,0.2327];
const N2B=[0.5578,0.6514,0.7222,0.7825,0.8126,0.8434,0.8693,0.8910,0.9092,0.9222,0.9319,0.9403,0.9477,0.9544,0.9602,0.9653];
const HEHT=[1.88,3.02,4.72,6.99,10.21,14.48,20.53,29.11,41.20,55.19,70.69,90.34,115.29,147.42,188.24,240.03];
const HEA=[1.6189,1.3830,1.1919,1.0458,0.9220,0.8205,0.7305,0.6502,0.5950,0.5545,0.5333,0.5189,0.5181,0.5176,0.5172,0.5119];
const HEB=[0.4770,0.5747,0.6527,0.7223,0.7582,0.7957,0.8279,0.8553,0.8757,0.8903,0.8997,0.9073,0.9122,0.9171,0.9217,0.9267];
const PWV=0.0627, TOL=0.03;
const fmt=(n,k=1)=>Number(n).toFixed(k).replace('.',',');

function envOf(s){
  const ps=1.01325*Math.pow(1-2.25577e-5*(s.env.alt||0),5.25588);
  const bpm=s.env.water==='salt'?0.10101:0.0980665;
  return {ps,bpm,P:d=>ps+Math.max(0,d)*bpm,D:p=>(p-ps)/bpm};
}
const H2HT=N2HT.map(t=>t/3.742);
const h2Of=g=>(g&&g.h2)||0;
function gasName(g){
  const x=h2Of(g);
  if(x>0) return g.he>0?'Hydreliox '+g.o2+'/'+g.he+'/'+x:'Hydrox '+g.o2+'/'+x;
  if(g.o2>=100) return 'Ossigeno';
  if(g.he<=0) return g.o2===21?'Aria':'EAN'+g.o2;
  if(g.o2+g.he>=100) return 'Heliox '+g.o2+'/'+g.he;
  return 'Trimix '+g.o2+'/'+g.he;
}
function ppO2(E,g,d){return E.P(d)*g.o2/100;}
function modOf(E,g,lim){return Math.max(0,(lim/(g.o2/100)-E.ps)/E.bpm);}
function minDepthOf(E,g,min){return Math.max(0,(min/(g.o2/100)-E.ps)/E.bpm);}
function endOf(E,s,g,d){
  const P=E.P(d), fo=g.o2/100, fh=g.he/100, fx=h2Of(g)/100, fn=Math.max(0,1-fo-fh-fx);
  const narc=s.lim.o2Narc?(fo+fn+0.55*fx):(fn+0.55*fx)/0.7902;
  return Math.max(0,(P*narc-E.ps)/E.bpm);
}
function densOf(E,g,d){
  const fo=g.o2/100, fh=g.he/100, fx=h2Of(g)/100, fn=Math.max(0,1-fo-fh-fx);
  return (fo*1.429+fh*0.1786+fx*0.0899+fn*1.2506)*E.P(d)/1.01325;
}
function cnsLim(p){
  if(p<=0.5) return Infinity;
  if(p<0.6) return 720*0.1/(p-0.5);
  if(p>=1.6) return 45*Math.pow(0.5,(p-1.6)/0.05);
  const T=[[0.6,720],[0.7,570],[0.8,450],[0.9,360],[1.0,300],[1.1,240],[1.2,210],[1.3,180],[1.4,150],[1.5,120],[1.6,45]];
  for(let i=0;i<T.length-1;i++){
    if(p<=T[i+1][0]){const f=(p-T[i][0])/(T[i+1][0]-T[i][0]);return T[i][1]+(T[i+1][1]-T[i][1])*f;}
  }
  return 45;
}
function abOf(i,pn,ph,px){
  const pt=pn+ph+px;
  return [(N2A[i]*pn+HEA[i]*(ph+px))/pt,(N2B[i]*pn+HEB[i]*(ph+px))/pt,pt];
}

class Sim{
  constructor(s,E){
    this.s=s;this.E=E;
    const p0=(E.ps-PWV)*0.7902;
    this.pn=new Array(16).fill(p0);this.ph=new Array(16).fill(0);this.px=new Array(16).fill(0);
    this.rt=0;this.d=0;this.cns=0;this.otu=0;this.maxPpo2=0;
    this.prof=[[0,0]];this.use={};this.useAsc={};
  }
  clone(){const c=Object.create(Sim.prototype);Object.assign(c,this);c.pn=this.pn.slice();c.ph=this.ph.slice();c.px=this.px.slice();c.prof=this.prof.map(p=>p.slice());c.use=Object.assign({},this.use);c.useAsc=Object.assign({},this.useAsc);return c;}
  insp(d,b){
    const P=this.E.P(d), pa=Math.max(0,P-PWV);
    if(b.k==='oc'){
      const fo=b.g.o2/100, fh=b.g.he/100, fx=h2Of(b.g)/100, fn=Math.max(0,1-fo-fh-fx);
      return {n:pa*fn,h:pa*fh,x:pa*fx,o:P*fo};
    }
    const fo=b.dil.o2/100, fh=b.dil.he/100, fx=h2Of(b.dil)/100, fn=Math.max(0,1-fo-fh-fx);

  }
  tick(dt,d,b,sac,key,asc){
    const ip=this.insp(d,b);
    for(let i=0;i<16;i++){
      this.pn[i]+=(ip.n-this.pn[i])*(1-Math.pow(2,-dt/N2HT[i]));
      this.ph[i]+=(ip.h-this.ph[i])*(1-Math.pow(2,-dt/HEHT[i]));
      if(ip.x>0||this.px[i]>0) this.px[i]+=(ip.x-this.px[i])*(1-Math.pow(2,-dt/H2HT[i]));

    }

    const [a,b,pt]=abOf(i,pn,ph,px), P=this.E.P(d), M=P/b+a;
    return {i,htN:N2HT[i],htH:HEHT[i],pn,ph,px,pct:(pt-P)/(M-P)*100,gf:gf*100};
  }
}

function bailoutGases(s){
  if(s.ccr.bailout&&s.ccr.bailout.length) return s.ccr.bailout;
  const dil={id:'__dil',o2:s.ccr.dil.o2,he:s.ccr.dil.he,role:'fondo',sw:null,cyl:null,n:1,virtual:true};
  return [dil,...s.gases.filter(g=>g.role!=='fondo')];
}

const H2CFG=s=>Object.assign({o2max:4,step:2,wash:10,stages:3,cyl:'s80'},s.h2cfg||{});
function isHydroOC(s){return !!s.h2exp&&s.mode==='oc'&&s.gases.some(g=>g.role==='fondo'&&h2Of(g)>0);}
/* best breathing mix for depth d: O2 from the ppO2 limit, helium from END and density */
function bestMix(E,s,d,lim,maxO2){
  const P=E.P(d);
  const f=Math.min(1,lim/P);
  let o2=f>=0.97?100:Math.max(1,Math.floor(100*f+1e-6));
  if(maxO2!=null) o2=Math.min(o2,maxO2);
  const fo=o2/100, Pend=E.P(s.lim.endMax);
  let fn=s.lim.o2Narc?Math.max(0,Pend/P-fo):Math.max(0,Pend/P*0.7902);
  fn=Math.min(fn,1-fo);
  let he=Math.max(0,Math.ceil(100*(1-fo-fn)-1e-9));
  if(o2+he>100) he=100-o2;
  while(he<100-o2&&densOf(E,{o2,he},d)>s.lim.densMax) he++;
  return {o2,he,h2:0};
}
/* hydreliox: the bottom mix and the number of stages are the input, the stages are computed here */
function hydroChain(s,E){
  E=E||envOf(s);
  const c=H2CFG(s), L=s.lim, I=s.algo.stopInt;
  const bot=s.gases.find(g=>g.role==='fondo'&&h2Of(g)>0);
  if(!bot) return null;
  const dH2=I*Math.ceil(minDepthOf(E,bot,L.ppo2Min)/I)+I;
  const tO2=Math.min(Math.max(bot.o2+1,bot.o2+c.step),Math.max(bot.o2+1,c.o2max));
  const trans={id:'__h2t',o2:tO2,he:100-tO2,h2:0,role:'viaggio',sw:null,cyl:c.cyl,n:1,auto:true,trans:true};
  const gases=[bot,trans], N=Math.max(1,Math.round(c.stages)), n2=N-1;
  const Pa=E.P(minDepthOf(E,trans,L.ppo2Min)), Pb=E.P(Math.max(3,s.algo.lastStop)), P21=E.P(21)+1e-9;
  for(let k=0;k<n2;k++){
    const Pk=n2===1?Pa:Pa*Math.pow(Pb/Pa,k/(n2-1)), deco=Pk<=P21;
    const m=bestMix(E,s,Math.max(0,E.D(Pk)),deco?L.ppo2Deco:L.ppo2Bottom);
    if(gases.some(g=>g.o2===m.o2)) continue;
    gases.push({id:'__h2s'+k,o2:m.o2,he:m.he,h2:0,role:deco?'deco':'viaggio',sw:null,cyl:c.cyl,n:1,auto:true});
  }
  return {gases,bot,trans,dH2};
}
function effGases(s){if(isHydroOC(s)){const h=hydroChain(s);if(h) return h.gases;}return s.gases;}
function bestDil(E,s,d){
  const c=H2CFG(s), sp=s.ccr.spHigh, safe=Math.max(0,(sp/(c.o2max/100)-E.ps)/E.bpm);
  if(s.h2exp&&d>=safe){
    const P=E.P(d), o2=Math.max(1,Math.min(c.o2max-1,Math.floor(100*1.0/P)));
    const Pend=E.P(s.lim.endMax), fo=o2/100;
    let fx=Math.max(0,Math.min(1-fo,((s.lim.o2Narc?Pend/P-fo:Pend/P*0.7902))/0.55));
    let h2=Math.floor(100*fx);
    return {o2,he:100-o2-h2,h2,safe};
  }
  const m=bestMix(E,s,d,1.1,21);
  return {o2:m.o2,he:m.he,h2:0,safe};
}
function plan(s,opt){

    if(f) return f;

  };

    if(ccrDown){

        const sd=safeD(s.ccr.spHigh);
        if(lv.d<sd-1e-6){W.push({lvl:'err',kind:'h2',t:'PERICOLO DI MORTE: settore '+(i+1)+' a '+lv.d+' m con diluente '+gasName(tgtDil)+': il loop avrebbe '+fmt(s.ccr.spHigh/E.P(lv.d)*100,1)+'% di ossigeno con idrogeno. Profondità minima sicura '+Math.ceil(sd)+' m.'});tgtDil=curDil;}
      }
      sim.move(lv.d,rate,ccrB,0,null,false);
    }else if(hydro&&lv.d>H.dH2&&sim.d<H.dH2-1e-6){
      sim.move(H.dH2,rate,d=>({k:'oc',g:pickDown(Math.min(d,H.dH2-0.01))}),sacB,(d,b)=>b.g.id,false);
      sim.stay(HC.wash,{k:'oc',g:H.trans},sacB,H.trans.id,false);
      rows.push({k:'wash',d:H.dH2,dur:HC.wash,rt:sim.rt,gas:gasName(H.trans),gid:H.trans.id});
      sim.move(lv.d,rate,d=>({k:'oc',g:pickDown(d)}),sacB,(d,b)=>b.g.id,false);
    }else sim.move(lv.d,rate,d=>({k:'oc',g:pickDown(d)}),sacB,(d,b)=>b.g.id,false);
    let hold=lv.t-sim.rt;
    if(hold<-1e-6){
      W.push({lvl:'err',kind:'timing',t:'Settore '+(i+1)+': arrivi a '+lv.d+' m al minuto '+fmt(sim.rt,1)+', dopo il minuto di stacco '+lv.t+'.'});
      hold=0;
    }
    if(ccrDown){
      spHighOn=true;

      sim.stay(hold,b,0,null,false);

    }else{
      const g=pickDown(lv.d);
      sim.stay(hold,{k:'oc',g},sacB,g.id,false);
      rows.push({k:'lvl',d:lv.d,dur:hold,rt:sim.rt,gas:gasName(g),gid:g.id});
    }
  }
  const bottomEndRt=sim.rt, dBot=sim.d, snap=sim.clone();
  let cur=ascOC?pickDown(dBot):null;
  const botGas=cur;
  if(ascOC&&cur){
    const p=ppO2(E,cur,dBot);
    if(p>L.ppo2Bottom+TOL) W.push({lvl:'warn',kind:'ppo2',t:gasName(cur)+' a '+dBot+' m: ppO₂ '+fmt(p,2)+', sopra il limite di '+fmt(L.ppo2Bottom,2)+'.'});
    if(p<L.ppo2Min) W.push({lvl:'err',kind:'hypo',t:gasName(cur)+' a '+dBot+' m è ipossico: ppO₂ '+fmt(p,2)+'.'});
  }
  const gfLo=A.gfLo/100, gfHi=Math.max(A.gfLo,A.gfHi)/100, I=A.stopInt, LS=A.lastStop;
  let sp=s.ccr.spHigh, first=null, dil=curDil;

  const sacA=ascOC?sacD:0;
  const kfA=ascOC?((dm,b)=>b.g.id):null;
  const label=()=>ascOC?gasName(cur):loopLabel(sp,dil);

  };
  let bestAsc=d=>{
    let best=null;
    for(const g of ocGases){
      const p=ppO2(E,g,d), lim=g.role==='deco'?L.ppo2Deco:L.ppo2Bottom;
      const ok=(g.sw!=null&&g.sw!=='')?d<=Number(g.sw)+1e-6:p<=lim+TOL;
      if(!ok||p<L.ppo2Min) continue;

    }

  };

    bestAsc=d=>{
      if(h2Of(cur)>0) return d<=H.dH2+1e-6?H.trans:null;
      let best=null;
      for(const g of H.gases){
        if(h2Of(g)>0) continue;
        const p=ppO2(E,g,d), lim=g.role==='deco'?L.ppo2Deco:L.ppo2Bottom;

      }

    };
  }

    if(h2Of(s.ccr.dil)===0&&ppO2(E,s.ccr.dil,d)<=1.6+TOL) return s.ccr.dil;

  };

  const nextOf=d=>{
    const onGrid=Math.abs(d/I-Math.round(d/I))<1e-6;
    let next=onGrid?Math.round(d/I)*I-I:Math.floor(d/I)*I;

      if(sim.ceilD(gf)<=next+1e-6){
        const rate=first===null?R.asc:(next===0?R.surf:R.stops);
        sim.move(next,rate,()=>breath(),sacA,kfA,true);
        d=next;
        if(d>0&&ascOC){

            const dur=hydro&&h2Of(prev)>0?Math.max(A.switchTime,HC.wash):A.switchTime;

    cns:sim.cns,otu:sim.otu,maxPpo2:sim.maxPpo2,prof:sim.prof,use:sim.use,useAsc:sim.useAsc,W,

/* Follow a fixed schedule from the bottom snapshot of r and check every move against the model.
   opt.extend: lengthen a stop until the next scheduled depth can be reached; opt.round: round durations up. */
function runSchedule(s,r,sched,opt){
  opt=opt||{};
  const E=r.E, A=s.algo, R=s.rates, sim=r.snap.clone();
  const gfLo=A.gfLo/100, gfHi=Math.max(A.gfLo,A.gfHi)/100, I=A.stopInt, LS=A.lastStop;
  const decoStops=sched.filter(x=>!x.sw);
  const anchor=Math.min(r.first||Infinity,decoStops.length?decoStops[0].d:Infinity);
  const gfAt=d=>d>=anchor-1e-6?gfLo:gfHi+(gfLo-gfHi)*(d/anchor);
  const byId=id=>r.ocGases.find(g=>g.id===id);
  let cur=r.ascOC?r.botGas:null, sp=s.ccr.spHigh, started=false, dil=r.botDil||s.ccr.dil;
  const brOf=()=>r.ascOC?{k:'oc',g:cur}:{k:'ccr',sp,dil};
  const sac=r.ascOC?s.cons.sacDeco*(r.bailout?s.cons.stress:1):0;
  const kf=r.ascOC?((dm,b)=>b.g.id):null;
  const goOn=(sm,to,st)=>{
    while(sm.d>to+1e-9){
      const d=sm.d, onGrid=Math.abs(d/I-Math.round(d/I))<1e-6;
      let nxt=onGrid?Math.round(d/I)*I-I:Math.floor(d/I)*I;
      if(nxt<LS-1e-6) nxt=d>LS+1e-6?LS:0;
      if(nxt<to) nxt=to;
      if(sm.ceilD(gfAt(nxt))>nxt+1e-6) return false;
      const rate=!st?R.asc:(nxt===0?R.surf:R.stops);
      sm.move(nxt,rate,()=>brOf(),sac,kf,true);
    }
    return true;
  };
  const rnd=m=>m>=10?Math.ceil(m/5)*5:Math.ceil(m/2)*2;
  const out=[];
  for(let k=0;k<sched.length;k++){
    const st=sched[k];
    if(!goOn(sim,st.d,started)) return {ok:false,failAt:st.d};
    if(!st.sw) started=true;
    if(r.ascOC&&st.gid&&st.gid!==cur.id){const g=byId(st.gid);if(g) cur=g;}
    if(!r.ascOC&&!st.sw) sp=s.ccr.spDeco;
    if(!r.ascOC&&st.sw&&st.toG) dil=st.toG;
    const useAt=Object.assign({},sim.use), pA=sim.pcts(st.d);
    let dur=opt.round?rnd(st.dur):st.dur;
    sim.stay(dur,brOf(),sac,r.ascOC?cur.id:null,true);
    if(opt.extend||opt.round){
      const nextT=k+1<sched.length?sched[k+1].d:0;
      const can=e=>{const c=sim.clone();if(e>0) c.stay(e,brOf(),0,null,true);return goOn(c,nextT,started);};
      let extra=0;
      if(!can(0)){
        let hi=1;while(!can(hi)&&hi<4096) hi*=2;
        let lo=hi>1?hi>>1:0;
        while(hi-lo>1){const m=(lo+hi)>>1;if(can(m)) hi=m;else lo=m;}
        extra=hi;sim.stay(extra,brOf(),sac,r.ascOC?cur.id:null,true);
      }
      dur+=extra;

    }

  o=o||{};

  let s2=s, base=r;

  if(I!==s.algo.stopInt||LSo!==s.algo.lastStop){
    s2=JSON.parse(JSON.stringify(s));

  const target=Math.max(1,Math.ceil(sched.length*(1-(o.reduce||0)/100)));

  while(sched.length>target&&guard++<60){
    let cand=[];
    for(let i=0;i<sched.length-1;i++) if(!sched[i].sw) cand.push(i);
    if(!cand.length) break;
    if(cand.length>6) cand=cand.slice().sort((a,b)=>sched[a].dur-sched[b].dur).slice(0,cand.length>12?3:5);
    let best=null;
    for(const i of cand){
      const t=sched.slice();t.splice(i,1);
      const rr=runSchedule(s2,base,t,{extend:true});
      if(rr.ok&&(!best||rr.runtime<best.runtime)) best=rr;
    }

  cur.simpleInfo={int:I,last:LSo,from:r.stops.length,to:cur.stops.length};

}

const ZHL16C=[

function planB(s){
  const surf=1.01325*Math.pow(1-2.25577e-5*(s.env.alt||0),5.25588);

  const down=s.gases.filter(g=>g.role!=='deco');
  const downGas=d=>{let fondo=null,best=null;for(const g of down){const p=amb(d)*g.o2/100;if(p<lim.ppo2Min-1e-9||p>lim.ppo2Bottom+slack) continue;if(g.role==='fondo'&&!fondo) fondo=g;if(!best||g.o2>best.o2) best=g;}return fondo||best||down.find(g=>g.role==='fondo')||down[0];};

  const loop=d=>{if(!high&&d>=s.ccr.spSwitch) high=true;return {ccr:true,sp:high?s.ccr.spHigh:s.ccr.spLow,o2:s.ccr.dil.o2/100,he:s.ccr.dil.he/100};};
  for(const lv of s.levels){
    const rate=lv.d>=here?s.rates.desc:s.rates.asc;
    travel(lv.d,Math.abs(lv.d-here)/rate,ccr?loop:(d=>toB(downGas(d))));
    const hold=Math.max(0,lv.t-clock);
    if(ccr){high=true;travel(lv.d,0,loop);const b=loop(lv.d);const iv=inert(lv.d,b);tis=tis.map((c,i)=>[schreiner(c[0],iv[0],0,hold,ZHL16C[i][0]),schreiner(c[1],iv[1],0,hold,ZHL16C[i][3])]);clock+=hold;}
    else{const b=toB(downGas(lv.d)), iv=inert(lv.d,b);tis=tis.map((c,i)=>[schreiner(c[0],iv[0],0,hold,ZHL16C[i][0]),schreiner(c[1],iv[1],0,hold,ZHL16C[i][3])]);clock+=hold;}
  }
  const leave=clock;

  const breath=()=>ccr?{ccr:true,sp,o2:s.ccr.dil.o2/100,he:s.ccr.dil.he/100}:toB(gas);
  const wait=(min)=>{const b=breath(), iv=inert(here,b);tis=tis.map((c,i)=>[schreiner(c[0],iv[0],0,min,ZHL16C[i][0]),schreiner(c[1],iv[1],0,min,ZHL16C[i][3])]);clock+=min;};

    const gf=firstStop==null?lo:hi+(lo-hi)*next/firstStop;
    if(ceiling(gf)<=next+1e-6){

function crossCheck(s,a){
  if(!a||!a.ok) return null;
  if(s.mode==='oc'&&s.gases.some(g=>h2Of(g)>0)) return {na:true,why:'idrogeno'};
  if(s.mode==='ccr'&&s.levels.some(l=>l.dil)) return {na:true,why:'diluenti per settore'};
  let b;try{b=planB(s);}catch(e){b=null;}
  if(!b) return {ok:false,diff:Infinity};
  const ma={}, mb={};
  for(const x of a.stops) ma[x.d]=(ma[x.d]||0)+x.dur;
  for(const x of b.stops) mb[x.d]=(mb[x.d]||0)+x.dur;
  let maxStop=0;
  for(const d of new Set(Object.keys(ma).concat(Object.keys(mb)))) maxStop=Math.max(maxStop,Math.abs((ma[d]||0)-(mb[d]||0)));

}

    const u=document.createElement('span');u.className='wunit';u.textContent=o.unit;el.appendChild(u);

    el.addEventListener('pointermove',e=>{

      const acc=1+Math.min(14,Math.pow(vel/0.5,2.2));

      d.v=0.6*d.v+0.4*(dv/dt);d.moved+=Math.abs(dy);d.y=e.clientY;d.t=e.timeStamp;

    const up=()=>{const d=this.drag;this.drag=null;if(!d) return;if(d.moved<6){this.snap();this.o.onTap&&this.o.onTap();return;}this.fling(d.v);};
    el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',()=>{this.drag=null;this.snap();});
    el.addEventListener('wheel',e=>{
      e.preventDefault();this.stop();
      const acc=1+Math.min(10,Math.abs(e.deltaY)/35);
      this.pos=clamp(this.pos+Math.sign(e.deltaY)*0.35*acc,this.o.min,this.o.max);this.render();

    });
    this.render();
  }
  stop(){cancelAnimationFrame(this.raf);this.raf=null;}
  set(v){this.stop();this.pos=v;this.render();}
  range(min,max){this.o.min=min;this.o.max=max;if(this.pos<min||this.pos>max){this.pos=clamp(Math.round(this.pos),min,max);}this.render();}
  fling(v){
    let lt=performance.now();
    const step=now=>{
      const dt=Math.min(40,now-lt);lt=now;
      this.pos+=v*dt;v*=Math.pow(0.955,dt/16);
      if(this.pos<this.o.min||this.pos>this.o.max){this.pos=clamp(this.pos,this.o.min,this.o.max);v=0;}
      this.render();
      if(Math.abs(v)<0.0012){this.snap();return;}
      this.raf=requestAnimationFrame(step);
    };
    this.raf=requestAnimationFrame(step);
  }
  snap(){
    this.stop();
    const from=this.pos, to=clamp(Math.round(this.pos),this.o.min,this.o.max), t0=performance.now();
    const step=now=>{const k=Math.min(1,(now-t0)/170), e=1-Math.pow(1-k,3);this.pos=from+(to-from)*e;this.render();if(k<1) this.raf=requestAnimationFrame(step);};
    this.raf=requestAnimationFrame(step);
  }
  render(){
    const base=Math.round(this.pos);
    for(let k=-4;k<=4;k++){
      const it=this.items[k+4], v=base+k, off=v-this.pos, a=Math.abs(off);
      if(v<this.o.min||v>this.o.max||a>3.6){it.style.opacity='0';it.textContent='';continue;}
      it.textContent=v;
      it.style.transform='translateY('+(off*ITEM*0.92)+'px) rotateX('+(-off*21)+'deg) scale('+(1-a*0.09)+')';
      it.style.opacity=String(Math.max(0,1-a*0.29));
      it.classList.toggle('warn',!!(this.o.zone&&this.o.zone(v)));
    }
    const iv=clamp(base,this.o.min,this.o.max);
    if(iv!==this.last){
      if(navigator.vibrate&&this.drag!==undefined){
        try{const z=this.o.zone;navigator.vibrate(z&&!!z(iv)!==!!z(this.last)?22:3);}catch(_){}
      }
      this.last=iv;this.o.onChange(iv);
    }
    this.el.setAttribute('aria-valuenow',iv);this.el.setAttribute('aria-valuemin',this.o.min);this.el.setAttribute('aria-valuemax',this.o.max);
    this.el.setAttribute('aria-valuetext',iv+' '+this.o.unitLong);
  }
}

function E0(){return envOf(S);}
function gasAtDepth(d){
  const E=E0(), L=S.lim, set=S.gases.filter(g=>g.role!=='deco');
  const ok=set.filter(g=>{const p=ppO2(E,g,d);return p>=L.ppo2Min&&p<=L.ppo2Bottom+TOL;});
  return ok.find(g=>g.role==='fondo')||ok.sort((a,b)=>b.o2-a.o2)[0]||set.find(g=>g.role==='fondo')||set[0]||null;
}
function depthGas(){const lv=S.levels[S.act]||{};return S.mode==='ccr'?(lv.dil||S.ccr.dil):gasAtDepth(currentDepth());}
function zoneDepth(v){
  const lv=S.levels[S.act]||{};const g=S.mode==='ccr'?(lv.dil||S.ccr.dil):(S.gases.find(x=>x.role==='fondo')||S.gases[0]);
  if(!g) return false;
  const E=E0(), lim=S.mode==='ccr'?1.6:S.lim.ppo2Bottom, w=S.warn;
  return (w.ppo2&&ppO2(E,g,v)>lim+TOL)||(w.end&&endOf(E,S,g,v)>S.lim.endMax)||(w.dens&&densOf(E,g,v)>S.lim.densMax);
}

/* ---------- checks ---------- */
function checks(r){
  const E=E0(), L=S.lim, w=S.warn, out=[], maxD=Math.max(...S.levels.map(l=>l.d)), H2M=S.h2cfg.o2max;
  if(w.deep&&maxD>w.deepVal) out.push({lvl:'warn',t:'Oltre '+w.deepVal+' m Bühlmann lavora fuori dai dati su cui è stato costruito: il piano è un’estrapolazione.',th:'model'});
  const ocSet=S.mode==='oc'?effGases(S):(r&&r.bailout?bailoutGases(S):null);
  if(ocSet){
    for(const g of ocSet){
      if((g.h2||0)>0&&g.o2>H2M) out.unshift({lvl:'err',t:'PERICOLO DI MORTE: '+gasName(g)+' contiene idrogeno con '+g.o2+'% di ossigeno. Sopra il '+H2M+'% la miscela è infiammabile ed esplosiva.',th:'h2'});
      if(g.role==='deco'){
        if(w.ppo2&&g.sw!=null&&g.sw!==''){const p=ppO2(E,g,Number(g.sw));if(p>L.ppo2Deco+TOL) out.push({lvl:'warn',t:gasName(g)+': cambio a '+g.sw+' m con ppO₂ '+fmt(p,2)+'.',th:'sw'});}
        continue;
      }
      const deepest=g.role==='fondo'?maxD:Math.min(maxD,modOf(E,g,L.ppo2Bottom));
      const en=endOf(E,S,g,deepest), de=densOf(E,g,deepest);
      if(w.end&&en>L.endMax+0.5) out.push({lvl:'warn',t:gasName(g)+' a '+Math.round(deepest)+' m: END '+Math.round(en)+' m, oltre '+L.endMax+' m.',th:'endMax'});
      if(w.dens){
        if(de>w.densAbs) out.push({lvl:'err',t:gasName(g)+' a '+Math.round(deepest)+' m: densità '+fmt(de,1)+' g/L, oltre il massimo di '+fmt(w.densAbs,1)+'.',th:'densMax'});
        else if(de>L.densMax) out.push({lvl:'warn',t:gasName(g)+' a '+Math.round(deepest)+' m: densità '+fmt(de,1)+' g/L, oltre '+fmt(L.densMax,1)+'.',th:'densMax'});
      }
    }
    if(ocSet.some(g=>(g.h2||0)>0)) out.unshift({lvl:'err',t:'Modalità sperimentale idrogeno: nessun modello di decompressione è validato per l’idrogeno. Questo piano è un’estrapolazione da studio, non da usare in acqua.',th:'h2'});
    if(S.mode==='oc'&&w.hypo&&!ocSet.some(g=>g.role!=='deco'&&ppO2(E,g,0)>=L.ppo2Min)) out.push({lvl:'err',t:'Nessun gas respirabile in superficie: aggiungi un gas da viaggio'+(isHydroOC(S)?' o una stage in più':'')+'.',th:'ppo2Min'});
  }
  if(S.mode==='ccr'){
    const used=[];
    S.levels.forEach(l=>{const g=l.dil||S.ccr.dil;used.push([g,l.d]);});
    const seen=new Set();
    for(const [g,d] of used){
      const k=g.o2+'/'+g.he+'/'+(g.h2||0)+'@'+d;if(seen.has(k)) continue;seen.add(k);
      const p=ppO2(E,g,d), de=densOf(E,g,d), en=endOf(E,S,g,d);
      if(w.ppo2&&p>1.6) out.push({lvl:'warn',t:'Diluente '+gasName(g)+' a '+d+' m: ppO₂ di flush '+fmt(p,2)+', sopra 1,6.',th:'dil'});
      if(w.end&&en>L.endMax+0.5) out.push({lvl:'warn',t:'Diluente '+gasName(g)+' a '+d+' m: END '+Math.round(en)+' m.',th:'endMax'});
      if(w.dens&&de>L.densMax) out.push({lvl:de>w.densAbs?'err':'warn',t:'Diluente '+gasName(g)+' a '+d+' m: densità '+fmt(de,1)+' g/L.',th:'densMax'});
    }
    if(S.levels.some(l=>l.dil&&(l.dil.h2||0)>0)) out.unshift({lvl:'err',t:'Modalità sperimentale idrogeno nel diluente: nessun modello è validato. In risalita il diluente cambia prima che il loop superi il '+H2M+'% di ossigeno.',th:'h2'});
  }
  if(S.lim.icd&&r&&r.ok){
    for(const x of r.stops){
      if(!x.sw||!x.from||!x.toG) continue;
      const nA=1-(x.from.o2+x.from.he+(x.from.h2||0))/100, nB=1-(x.toG.o2+x.toG.he+(x.toG.h2||0))/100, dN=nB-nA, dH=(x.from.he+(x.from.h2||0)-x.toG.he-(x.toG.h2||0))/100;
      if(dH>0&&dN>dH/5+1e-9) out.push({lvl:'warn',t:'Cambio a '+fmt(x.d,0)+' m da '+gasName(x.from)+' a '+gasName(x.toG)+': l’azoto sale di '+Math.round(dN*100)+' punti mentre il gas leggero scende di '+Math.round(dH*100)+'. Supera la regola dei quinti (controdiffusione isobarica).',th:'icd'});
    }
  }
  if(r&&r.ok){
    if(w.cns){
      if(r.cns>w.cnsMax) out.push({lvl:'err',t:'CNS '+Math.round(r.cns)+'%: oltre il '+w.cnsMax+'%.',th:'cns'});
      else if(r.cns>w.cnsWarn) out.push({lvl:'warn',t:'CNS '+Math.round(r.cns)+'%: oltre l’avviso del '+w.cnsWarn+'%.',th:'cns'});
    }
    if(w.otu&&r.otu>w.otuMax) out.push({lvl:'warn',t:'OTU '+Math.round(r.otu)+': oltre '+w.otuMax+'.',th:'otu'});
  }
  return out;
}

/* ---------- multilevel profile on the home ---------- */
function lvlProfileHTML(){
  if(S.levels.length<2) return '';
  const R=S.rates, pts=[[0,0]], segs=[];
  let t=0,d=0,bad=[];
  S.levels.forEach((l,i)=>{
    const rate=l.d>=d?R.desc:R.asc;t+=Math.abs(l.d-d)/rate;pts.push([t,l.d]);
    if(t>l.t+1e-6) bad.push(i);
    const t0=t;t=Math.max(t,l.t);pts.push([t,l.d]);segs.push([t0,t,l.d,i]);d=l.d;
  });
  const tEnd=t+d/R.asc, maxD=Math.max(...S.levels.map(l=>l.d));
  const W=340,H=96,px=8,top=10,bot=22, X=v=>px+(W-2*px)*v/Math.max(1,tEnd), Y=v=>top+(H-top-bot)*v/Math.max(1,maxD);
  let g='<polyline points="'+pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')+'" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>';
  g+='<line x1="'+X(t)+'" y1="'+Y(d)+'" x2="'+X(tEnd)+'" y2="'+Y(0)+'" stroke="var(--ink2)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  for(const [a,b,dd,i] of segs){
    const act=i===S.act, err=bad.includes(i);
    g+='<line x1="'+X(a)+'" y1="'+Y(dd)+'" x2="'+X(b)+'" y2="'+Y(dd)+'" stroke="'+(err?'var(--err)':act?'var(--warn)':'var(--ink)')+'" stroke-width="'+(act?5:3)+'" stroke-linecap="round"/>';
    g+='<text x="'+X(b)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="'+(act?'var(--warn)':'var(--ink2)')+'">'+S.levels[i].t+'′</text>';
    g+='<text x="'+((X(a)+X(b))/2)+'" y="'+(Y(dd)-6)+'" text-anchor="middle" font-size="10" fill="var(--ink2)">'+dd+' m</text>';
  }
  return '<div class="card glass lprof" data-th="time"><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Profilo dei settori: profondità e minuti di stacco">'+g+'</svg>'+(bad.length?'<p class="lpw">Il settore '+(bad[0]+1)+' arriva dopo il suo minuto di stacco.</p>':'')+'</div>';
}

/* ---------- gas reports ---------- */
function gasReport(r){
  const C=S.cons, items=[];
  for(const g of r.ocGases){
    const used=r.use[g.id]||0;
    if(g.virtual){items.push({name:gasName(g)+' (diluente)',used,cap:0,virtual:true});continue;}
    const cyl=cylOf(g.cyl), n=Math.max(1,g.n||1), cap=cyl.vol*cyl.bar*n;
    let reserve=0, rnote='';
    if(C.reserve==='thirds'){reserve=cap/3;rnote='riserva di un terzo';}
    else if(C.reserve==='rock'&&!r.bailout&&r.botGas&&g.id===r.botGas.id){
      reserve=(C.problemMin*r.E.P(r.dBot)*C.sacBottom+(r.useAsc[g.id]||0))*C.stress*C.divers;rnote='gas minimo';
    }
    const endBar=(cap-used)/(cyl.vol*n);
    items.push({name:gasName(g),cylLabel:n+' × '+cyl.name,used,cap,reserve,rnote,endBar,
      lvl:used>cap?'err':(used+reserve>cap?'warn':'ok')});
  }
  return items;
}
function ring(used,res,label){
  const C=251.3, fu=clamp(used,0,1), fr=clamp(res,0,1-fu);
  return '<svg width="92" height="92" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="40" fill="none" stroke="var(--line)" stroke-width="10"/>'+
    (fr>0?'<circle cx="48" cy="48" r="40" fill="none" stroke="var(--warn)" stroke-width="10" stroke-dasharray="'+(fr*C)+' '+C+'" stroke-dashoffset="'+(-fu*C)+'" transform="rotate(-90 48 48)"/>':'')+
    '<circle cx="48" cy="48" r="40" fill="none" stroke="var(--ink)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+Math.max(0.01,fu*C)+' '+C+'" transform="rotate(-90 48 48)"/>'+
    '<text x="48" y="56" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="26" fill="var(--ink)">'+label+'</text></svg>';
}
function gasCards(r){
  if(!r||r.error) return '';

    if(it.virtual){
      h+='<div class="card glass gasc">'+ring(0,0,'–')+'<div><div class="t">'+esc(it.name)+'</div><div class="d">'+fmtL(it.used)+' L dal bombolino del diluente</div></div></div>';

/* ---------- metro map: every gas-loss scenario as its own line ---------- */
let COLS={},COLN=0;
function colOf(name){if(!(name in COLS)) COLS[name]='var(--g'+((COLN++%6)+1)+')';return COLS[name];}
function legendHTML(){return '<div class="legend">'+Object.keys(COLS).map(k=>'<span><i style="background:'+COLS[k]+'"></i>'+esc(k)+'</span>').join('')+'</div>';}
const VAR={};
function contSel(){const l=S.cont.list;return l[Math.min(S.cont.sel||0,l.length-1)]||{dd:5,dt:5};}
function variant(kind,excl){
  const key=kind+'|'+excl.slice().sort().join(',');
  if(VAR[key]) return VAR[key];
  const T=deep(S);let r;
  if(kind==='bail'){
    if(T.ccr.bailout.length) T.ccr.bailout=T.ccr.bailout.filter(g=>!excl.includes(g.id));
    else T.gases=T.gases.filter(g=>!excl.includes(g.id));
    r=plan(T,{bailout:true});
  }else{
    T.gases=T.gases.filter(g=>!excl.includes(g.id));
    r=kind==='cont'?plan(T,{dd:contSel().dd,dt:contSel().dt}):plan(T);
  }
  VAR[key]=r;return r;
}
function gasById(id){return S.gases.concat(S.ccr.bailout).find(g=>g.id===id);}
function scenarioTree(root,kind,allow){
  const nodes=[{r:root,excl:[],forkD:null,parent:-1,forkSi:null}];
  if(!allow) return nodes;
  const visit=ni=>{
    const n=nodes[ni];
    n.r.stops.forEach((x,si)=>{
      if(nodes.length>=8) return;
      const g=x.toG;
      if(!x.sw||!g||!g.id||g.virtual||g.auto||(g.h2||0)>0) return;
      if(n.forkD!=null&&x.d>=n.forkD-1e-6) return;
      if(n.excl.includes(g.id)) return;
      const excl=n.excl.concat(g.id), b=variant(kind,excl);
      if(!b||!b.ok) return;
      nodes.push({r:b,excl,forkD:x.d,parent:ni,forkSi:si});
      visit(nodes.length-1);
    });
  };
  visit(0);
  return nodes;
}
/* horizontal metro: kept for future use, switched off */
const METRO_H=false;
function gasSeq(nd){
  const r=nd.r, seq=[r.levels[r.levels.length-1].gas];
  for(const st of r.stops) if(st.gas!==seq[seq.length-1]) seq.push(st.gas);
  return seq;
}
function metroMapH(nodes,rootRi){
  const n=nodes.length, k=v=>Math.round(v*100)/100;
  const set=new Set();
  nodes.forEach(nd=>nd.r.stops.forEach(x=>{if(nd.forkD==null||x.d<=nd.forkD+1e-6) set.add(k(x.d));}));
  const depths=[...set].sort((a,b)=>b-a);
  const root=nodes[0].r, lastLv=root.levels[root.levels.length-1];
  const CW=46, left=14, top=22, RH=64, X={};
  let x=left+CW*0.5;const xBot=x;x+=CW;
  for(const d of depths){X[d]=x;x+=CW;}
  const xSurf=x, W=Math.max(340,xSurf+CW*0.9), H=top+RH*n+6;
  const Y=c=>top+RH*c+RH*0.6;
  let grid='', lines='', dots='';
  grid+='<text x="'+xBot+'" y="13" text-anchor="middle" font-size="10.5" fill="var(--ink2)">'+fmt(lastLv.d,0)+' m</text>';
  for(const d of depths) grid+='<line x1="'+X[d]+'" x2="'+X[d]+'" y1="'+(top-2)+'" y2="'+(H-4)+'" stroke="var(--line)"/><text x="'+X[d]+'" y="13" text-anchor="middle" font-size="10.5" fill="var(--ink2)">'+fmt(d,0)+'</text>';
  grid+='<text x="'+xSurf+'" y="13" text-anchor="middle" font-size="10.5" fill="var(--ink2)">0 m</text>';
  const ris=nodes.map((nd,i)=>i===0&&rootRi!=null?rootRi:reg(nd.r));
  nodes.forEach((nd,c)=>{
    const r=nd.r, y=Y(c), pts=[];
    const seq=gasSeq(nd).map(shortGas).join(' → '), d=Math.ceil(r.runtime)-Math.ceil(root.runtime);
    const lx=nd.parent<0?left:X[k(nd.forkD)]-CW*0.3;
    grid+='<text x="'+lx+'" y="'+(y-20)+'" font-size="11.5" font-weight="600" fill="var(--ink)">'+esc(seq)+'<tspan font-weight="400" fill="var(--ink2)">  '+Math.ceil(r.runtime)+'′'+(d>0?' +'+d+'′':'')+'</tspan></text>';
    if(nd.parent<0) pts.push({x:xBot,y,gas:lastLv.gas,rt:lastLv.rt,bottom:true});
    else{
      const pn=nodes[nd.parent], prevGas=nd.forkSi>0?pn.r.stops[nd.forkSi-1].gas:pn.r.levels[pn.r.levels.length-1].gas;
      pts.push({x:X[k(nd.forkD)],y:Y(nd.parent),gas:prevGas,fork:true});
    }
    r.stops.forEach((st,si)=>{if(nd.forkD!=null&&st.d>nd.forkD+1e-6) return;pts.push({x:X[k(st.d)],y,gas:st.gas,si,sw:st.sw,rt:st.rt});});
    pts.push({x:xSurf,y,surf:true,rt:r.runtime,gas:null});
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i], b=pts[i+1], col=colOf(a.gas||b.gas), dash=nd.parent>=0&&i===0?' stroke-dasharray="7 5"':'';

      else lines+='<path d="M'+a.x+','+a.y+' C'+(a.x+(b.x-a.x)*0.55)+','+a.y+' '+(a.x+(b.x-a.x)*0.45)+','+b.y+' '+b.x+','+b.y+'" fill="none" stroke="'+col+'" stroke-width="5" stroke-linecap="round"'+dash+'/>';
    }
    for(const p of pts){
      if(p.fork) continue;
      const col=colOf(p.gas||(pts[pts.length-2]&&pts[pts.length-2].gas)||lastLv.gas);
      let g;
      if(p.surf) g='<circle cx="'+p.x+'" cy="'+p.y+'" r="6.5" fill="var(--ink)"/>';
      else if(p.bottom) g='<circle cx="'+p.x+'" cy="'+p.y+'" r="6" fill="'+col+'"/>';
      else if(p.sw) g='<circle cx="'+p.x+'" cy="'+p.y+'" r="8.5" fill="var(--base)" stroke="'+col+'" stroke-width="3"/><circle cx="'+p.x+'" cy="'+p.y+'" r="3.5" fill="'+col+'"/>';
      else g='<circle cx="'+p.x+'" cy="'+p.y+'" r="5.5" fill="var(--base)" stroke="'+col+'" stroke-width="3"/>';
      const tx='<text x="'+p.x+'" y="'+(p.y+21)+'" text-anchor="middle" font-size="'+(p.surf?12:10.5)+'" font-weight="'+(p.surf?700:400)+'" fill="var(--ink)">'+Math.ceil((p.rt||0)-1e-6)+'′</text>';
      if(p.si!=null) dots+='<g class="mst" data-ri="'+ris[c]+'" data-si="'+p.si+'" tabindex="0" role="button" aria-label="'+esc(seq)+': sosta a '+fmt(r.stops[p.si].d,0)+' metri"><circle cx="'+p.x+'" cy="'+p.y+'" r="15" fill="transparent"/>'+g+tx+'</g>';
      else dots+=g+tx;
    }
  });
  return '<div class="card glass metro"><div class="mscroll"><svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Mappa orizzontale delle soste con '+n+(n===1?' scenario':' scenari')+'">'+grid+lines+dots+'</svg></div>'+(W>360?'<p class="foot" style="margin:6px 0 0">Scorri di lato per vedere tutte le soste.</p>':'')+legendHTML()+'</div>';
}
function metroMap(nodes,rootRi){
  const n=nodes.length, W=340, AX=40, colW=(W-AX-4)/n, rowH=n>4?30:34, top=n>1?24:12;
  const k=v=>Math.round(v*100)/100;
  const set=new Set();
  nodes.forEach(nd=>nd.r.stops.forEach(x=>{if(nd.forkD==null||x.d<=nd.forkD+1e-6) set.add(k(x.d));}));
  const depths=[...set].sort((a,b)=>b-a), Y={};
  const root=nodes[0].r, lastLv=root.levels[root.levels.length-1];
  let y=top+rowH*0.5;const yBot=y;y+=rowH;
  for(const d of depths){Y[d]=y;y+=rowH;}
  const ySurf=y, H=ySurf+rowH*0.6;
  const X=c=>AX+colW*(c+0.5), fs=n>5?9:10.5, showDur=n<=2;
  let lines='', dots='', labels='';
  labels+='<text x="2" y="'+(yBot+4)+'" font-size="10.5" fill="var(--ink2)">'+fmt(lastLv.d,0)+' m</text>';
  for(const d of depths) labels+='<line x1="'+AX+'" x2="'+(W-2)+'" y1="'+Y[d]+'" y2="'+Y[d]+'" stroke="var(--line)"/><text x="2" y="'+(Y[d]+4)+'" font-size="10.5" fill="var(--ink2)">'+fmt(d,0)+' m</text>';
  labels+='<text x="2" y="'+(ySurf+4)+'" font-size="10.5" fill="var(--ink2)">0 m</text>';
  const L=['A','B','C','D','E','F','G','H'];
  const ris=nodes.map((nd,i)=>i===0&&rootRi!=null?rootRi:reg(nd.r));
  nodes.forEach((nd,c)=>{
    const r=nd.r, x=X(c), pts=[];
    if(n>1) labels+='<text x="'+x+'" y="12" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">'+L[c]+'</text>';
    if(nd.parent<0) pts.push({x,y:yBot,gas:lastLv.gas,rt:lastLv.rt,bottom:true});
    else{
      const pn=nodes[nd.parent], prevGas=nd.forkSi>0?pn.r.stops[nd.forkSi-1].gas:pn.r.levels[pn.r.levels.length-1].gas;
      pts.push({x:X(nd.parent),y:Y[k(nd.forkD)],gas:prevGas,fork:true});
    }
    r.stops.forEach((st,si)=>{if(nd.forkD!=null&&st.d>nd.forkD+1e-6) return;pts.push({x,y:Y[k(st.d)],gas:st.gas,si,sw:st.sw,rt:st.rt,dur:st.dur});});
    pts.push({x,y:ySurf,surf:true,rt:r.runtime,gas:null});
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i], b=pts[i+1], col=colOf(a.gas||b.gas);
      const dash=nd.parent>=0&&i===0?' stroke-dasharray="7 5"':'';
      if(a.x===b.x||a.y===b.y) lines+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+col+'" stroke-width="5" stroke-linecap="round"'+dash+'/>';
      else{const my=a.y+(b.y-a.y)*0.55;lines+='<path d="M'+a.x+','+a.y+' C'+a.x+','+my+' '+b.x+','+(a.y+(b.y-a.y)*0.45)+' '+b.x+','+b.y+'" fill="none" stroke="'+col+'" stroke-width="5" stroke-linecap="round"'+dash+'/>';}
    }
    for(const p of pts){
      if(p.fork) continue;
      const col=colOf(p.gas||(pts[pts.length-2]&&pts[pts.length-2].gas)||lastLv.gas);
      let g='';
      if(p.surf) g='<circle cx="'+p.x+'" cy="'+p.y+'" r="6.5" fill="var(--ink)"/>';
      else if(p.bottom) g='<circle cx="'+p.x+'" cy="'+p.y+'" r="6" fill="'+col+'"/>';
      else if(p.sw) g='<circle cx="'+p.x+'" cy="'+p.y+'" r="8.5" fill="var(--base)" stroke="'+col+'" stroke-width="3"/><circle cx="'+p.x+'" cy="'+p.y+'" r="3.5" fill="'+col+'"/>';
      else g='<circle cx="'+p.x+'" cy="'+p.y+'" r="5.5" fill="var(--base)" stroke="'+col+'" stroke-width="3"/>';
      const lab=Math.ceil((p.rt||0)-1e-6)+'′'+(showDur&&p.dur!=null?'  ('+Math.round(p.dur)+'′)':'');
      const tx='<text x="'+(p.x+10)+'" y="'+(p.y+4)+'" font-size="'+(p.surf?fs+2:fs)+'" font-weight="'+(p.surf?700:400)+'" fill="var(--ink)" stroke="var(--base)" stroke-width="3" paint-order="stroke">'+lab+'</text>';
      if(p.si!=null) dots+='<g class="mst" data-ri="'+ris[c]+'" data-si="'+p.si+'" tabindex="0" role="button" aria-label="'+L[c]+': sosta a '+fmt(r.stops[p.si].d,0)+' metri"><circle cx="'+p.x+'" cy="'+p.y+'" r="14" fill="transparent"/>'+g+tx+'</g>';
      else dots+=g+tx;
    }
  });
  let h='<div class="card glass metro"><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Mappa delle soste'+(n>1?' con '+n+' scenari':'')+'">'+labels+lines+dots+'</svg>';
  if(n>1){
    h+='<div class="scen">'+nodes.map((nd,c)=>{
      const lost=nd.excl.map(id=>{const g=gasById(id);return g?gasName(g):'?';});
      const d=Math.ceil(nd.r.runtime)-Math.ceil(root.runtime);
      return '<div class="sc"><b>'+L[c]+'</b><span>'+(lost.length?'Senza '+esc(lost.join(' e ')):'Tutti i gas')+(nd.forkD!=null?', bivio a '+fmt(nd.forkD,0)+' m':'')+'</span><em>'+Math.ceil(nd.r.runtime)+'′'+(d>0?' +'+d+'′':'')+'</em></div>';
    }).join('')+'</div>';
  }
  return h+legendHTML()+'</div>';
}

/* trim (gas weight) */
function dens20(g){const fo=g.o2/100,fh=g.he/100,fx=((g&&g.h2)||0)/100,fn=Math.max(0,1-fo-fh-fx);return fo*1.331+fh*0.166+fx*0.0838+fn*1.165;}
function trimHTML(r){
  if(!r||!r.ok) return '';
  const last=r.stops.length?r.stops[r.stops.length-1]:null;
  let start=0,used=0,usedLast=0;
  if(r.ascOC){
    for(const g of r.ocGases){
      if(g.virtual) continue;
      const c=cylOf(g.cyl), n=Math.max(1,g.n||1), de=dens20(g)/1000;
      start+=c.vol*c.bar*n*de;used+=(r.use[g.id]||0)*de;
      usedLast+=((last&&last.useAt&&last.useAt[g.id])||(last?0:(r.use[g.id]||0)))*de;
    }
  }else{
    const c=S.ccr, dO=dens20({o2:100,he:0})/1000, dD=dens20(c.dil)/1000;
    const dil=c.loop*(r.E.P(r.maxD)-r.E.ps)+c.dilExtra, tLast=last?last.rt-last.dur:r.runtime;
    start=c.o2Vol*c.o2Bar*dO+c.dilVol*c.dilBar*dD;used=c.metab*r.runtime*dO+dil*dD;usedLast=c.metab*tLast*dO+dil*dD;
  }
  return '<div class="card glass" data-th="trim"><div class="gasc" style="align-items:flex-start"><div><div class="t">Assetto</div>'+
    '<div class="d">Gas a bordo in partenza: '+fmt(start,1)+' kg</div>'+
    (last?'<div class="d">All’arrivo all’ultima sosta, a '+fmt(last.d,0)+' m: <b>'+fmt(usedLast,1)+' kg più leggero</b></div>':'')+
    '<div class="d">In superficie: <b>'+fmt(used,1)+' kg più leggero</b></div>'+
    '<div class="d" style="margin-top:6px">Conta solo il peso del gas respirato. Per la zavorra esatta somma la spinta delle bombole vuote.</div></div></div></div>';
}
function penHTML(r){
  if(!S.pen.on||!r||!r.ok) return '';
  const k=Number(S.pen.rule)||3, D=r.maxD, P=r.E.P(D), C=S.cons;
  let name,cap,t,basis;
  if(S.mode==='oc'){
    const g=r.botGas;if(!g) return '';
    const c=cylOf(g.cyl), n=Math.max(1,g.n||1);cap=c.vol*c.bar*n;name=gasName(g)+', '+n+' × '+c.name;
    t=(cap/k)/(C.sacBottom*P);basis='Usi 1/'+k+' del gas per entrare, al SAC di fondo.';
  }else{
    const bg=bailoutGases(S).find(g=>g.role==='fondo')||bailoutGases(S)[0];
    if(!bg) return '';
    if(bg.virtual){cap=S.ccr.dilVol*S.ccr.dilBar;name=gasName(bg)+', bombolino del diluente';}
    else{const c=cylOf(bg.cyl), n=Math.max(1,bg.n||1);cap=c.vol*c.bar*n;name=gasName(bg)+', '+n+' × '+c.name;}
    t=(cap*(1-1/k))/(C.sacBottom*C.stress*P);basis='Il bailout deve bastare per uscire da solo sotto stress (SAC × '+fmt(C.stress,1)+'), tenendo 1/'+k+' di riserva.';
  }
  const dist=t*S.pen.speed, lv=r.levels[r.levels.length-1], over=S.mode==='oc'&&lv&&lv.dur>2*t;
  return '<div class="card glass" data-th="pen"><div class="t" style="font-size:17px;font-weight:600">Penetrazione a '+fmt(D,0)+' m</div>'+
    '<div class="big" style="margin:6px 0"><div><span class="lab">Gira entro</span><span class="serif num" style="font-size:52px">'+Math.floor(t)+'′</span></div><div class="r"><span class="lab">Sagola</span><span class="serif num it" style="font-size:52px">'+fmtL(Math.floor(dist/10)*10)+' m</span></div></div>'+
    '<div class="d" style="font-size:14px;color:var(--ink2)">'+esc(name)+'. '+esc(basis)+' Velocità '+S.pen.speed+' m/min.</div>'+
    (over?'<div class="w" style="font-size:13px;color:var(--warn);margin-top:6px">Il tempo sul fondo supera andata e ritorno con questa regola.</div>':'')+'</div>';
}
function hydroHTML(r){
  if(!r||!r.ok||!r.hydro) return '';
  const H=r.hydro, E=r.E, L=S.lim;
  const rows=H.gases.filter(g=>g!==H.bot).map(g=>{
    const from=g.trans?H.dH2:Math.round(modOf(E,g,g.role==='deco'?L.ppo2Deco:L.ppo2Bottom));
    return '<div class="d">'+esc(gasName(g))+': '+(g.trans?'cambio a '+H.dH2+' m con '+S.h2cfg.wash+'′ di lavaggio':(g.role==='deco'?'deco':'viaggio')+', da '+from+' m')+'</div>';
  }).join('');
  return '<div class="card glass" data-th="h2chain"><div class="t" style="font-size:17px;font-weight:600">Stage calcolate per l’idrogeno</div>'+rows+'<div class="d" style="margin-top:6px">In discesa passi sull’idrogeno solo dopo il lavaggio a '+H.dH2+' m con '+esc(gasName(H.trans))+'.</div></div>';
}

/* ---------- plan pages ---------- */
let PLAN=null;
function simpleKey(){const p=S.simp;return p.int+'|'+p.last+'|'+p.reduce+'|'+(p.round?1:0);}
function getSimple(){
  if(!PLAN.main.ok) return null;
  const k=simpleKey();
  if(!(k in PLAN.simpleCache)) PLAN.simpleCache[k]=simplifyPlan(S,PLAN.main,{int:S.simp.int,last:S.simp.last,reduce:S.simp.reduce,round:S.simp.round});
  return PLAN.simpleCache[k];
}
function curPiano(){return S.simple?(getSimple()||PLAN.main):PLAN.main;}
function segH(attr,opts,cur){return '<div class="seg small glass" role="group">'+opts.map(o=>'<button type="button" data-'+attr+'="'+o[0]+'" aria-pressed="'+(String(cur)===String(o[0]))+'">'+o[1]+'</button>').join('')+'</div>';}
function simpleCtrls(){
  const sp=S.simp;
  return '<div class="card glass simp">'+
    '<div class="srow" data-th="simpInt"><span>Intervallo</span>'+segH('sint',[[3,'3 m'],[5,'5 m'],[6,'6 m'],[9,'9 m']],sp.int)+'</div>'+
    '<div class="srow" data-th="simpLast"><span>Ultima sosta</span>'+segH('slast',[[3,'3 m'],[5,'5 m'],[6,'6 m'],[9,'9 m']],sp.last)+'</div>'+
    '<div class="srow" data-th="simpRed"><span>Soste in meno</span>'+segH('sred',[[0,'0'],[25,'−25%'],[50,'−50%'],[75,'−75%']],sp.reduce)+'</div>'+
    '<div class="srow" data-th="simpRound"><span>Durate tonde</span><button type="button" class="toggle" role="switch" aria-checked="'+!!sp.round+'" aria-label="Durate tonde" data-sround="1"></button></div>'+

const dlt=c=>(c.dd>=0?'+':'−')+Math.abs(c.dd)+' m '+(c.dt>=0?'+':'−')+Math.abs(c.dt)+'′';
function contOk(r){
  if(!r||!r.ok) return false;
  if(S.mode==='oc') return gasReport(r).every(x=>x.virtual||x.lvl==='ok'||(x.lvl==='warn'&&!S.warn.reserve));
  const c=S.ccr;
  return c.metab*r.runtime<=c.o2Vol*c.o2Bar&&c.loop*(r.E.P(r.maxD)-r.E.ps)+c.dilExtra<=c.dilVol*c.dilBar;
}
function contHTML(){

  if(m.ok) h+='<tr><td>Piano</td><td>'+Math.ceil(m.runtime)+'′</td><td>'+Math.ceil(m.tts)+'′</td><td>'+Math.round(m.cns)+'%</td><td>'+(contOk(m)?'ok':'<span style="color:var(--warn)">!</span>')+'</td></tr>';

  });
  h+='</tbody></table><p class="foot" style="margin-top:8px">Tocca uno scenario per vederne il piano. Gli scenari si configurano in Impostazioni → Contingenza.</p></div>';
  const r=PLAN.conts[sel];
  h+=resultHTML(r,'Scenario '+dlt(list[sel])+': profondità e tempo cambiano su ogni settore.',{fork:S.mode==='oc'?'cont':null});

function buildPages(){
  REG=[];
  const m=PLAN.main, pages=[];
  let note='';
  const pr=curPiano();
  if(S.simple&&m.ok){
    const sr=getSimple();
    if(sr){
      const dt=Math.ceil(sr.runtime)-Math.ceil(m.runtime);
      note=(sr.stops.length<m.stops.length?sr.stops.length+' soste invece di '+m.stops.length:'Stesso numero di soste')+', '+(dt>0?dt+' minuti in più':'stesso runtime')+'. Ogni risalita è verificata con il modello.';
    }else note=m.ndl?'Niente da semplificare: il piano è senza decompressione.':'Con questi parametri non trovo una versione semplificata valida.';
  }
  const ctrls=m.ok?'<div class="ctrls"><div class="seg small glass" role="group" aria-label="Versione"><button type="button" data-simple="0" aria-pressed="'+!S.simple+'">Completo</button><button type="button" data-simple="1" aria-pressed="'+!!S.simple+'">Semplice</button></div><div class="seg small glass" role="group" aria-label="Vista"><button type="button" data-view="table" aria-pressed="'+(S.view!=='metro')+'">Tabella</button><button type="button" data-view="metro" aria-pressed="'+(S.view==='metro')+'">Metro</button></div>'+(METRO_H&&S.view==='metro'?'<div class="seg small glass" role="group" aria-label="Orientamento della mappa"><button type="button" data-mdir="v" aria-pressed="'+(S.metroDir!=='h')+'">Verticale</button><button type="button" data-mdir="h" aria-pressed="'+(S.metroDir==='h')+'">Orizzontale</button></div>':'')+'</div>':'';
  pages.push({key:'piano',label:'Piano',html:ctrls+resultHTML(pr,note,{dual:PLAN.cc,fork:S.mode==='oc'?'main':null,pre:S.simple&&m.ok?simpleCtrls():''})+(m.ok?hydroHTML(m)+'<button class="cta" type="button" id="btnShare" style="margin-top:4px">Condividi la scheda</button>':'')});
  let gasH='';
  if(m.ok) gasH=(S.mode==='ccr'?ccrCards(m):gasCards(m)+'<p class="foot">Nel cerchio: bar previsti a fine immersione. Pieno = gas usato, ambra = riserva.</p>')+trimHTML(m)+penHTML(m);
  else gasH='<div class="empty">'+esc(m.error||'')+'</div>';
  pages.push({key:'gas',label:'Gas',html:'<div data-th="sacBottom" class="wline info"><b>i</b><span>SAC '+S.cons.sacBottom+' L/min sul fondo, '+S.cons.sacDeco+' in risalita.</span></div>'+gasH});
  if(S.mode==='ccr'){
    const b=PLAN.bail;
    const bn=S.ccr.bailout.length?'Abbandono del loop alla fine dell’ultimo settore, SAC × '+fmt(S.cons.stress,1)+'.':'Nessuna miscela di bailout configurata: uso diluente e gas disponibili. SAC × '+fmt(S.cons.stress,1)+'.';
    pages.push({key:'bail',label:'Bailout',html:resultHTML(b,bn,{fork:'bail'})+(b.ok?gasCards(b):'')});
  }
  pages.push({key:'cont',label:'Contingenza',html:contHTML()});
  PLAN.pageKeys=pages.map(p=>p.key);
  return pages;
}
function renderPages(keep){
  const tabs=$('#tabs'), pager=$('#pager'), left=keep?pager.scrollLeft:0, tops=keep?[...pager.querySelectorAll('.pg')].map(p=>p.scrollTop):[];
  const pages=buildPages();
  tabs.innerHTML=pages.map((p,i)=>'<button type="button" role="tab" aria-selected="'+(i===0)+'" data-i="'+i+'">'+esc(p.label)+'</button>').join('');
  pager.innerHTML=pages.map((p,i)=>'<section class="pg" role="tabpanel" data-pi="'+i+'">'+p.html+'</section>').join('');
  pager.scrollLeft=left;
  pager.querySelectorAll('.pg').forEach((p,i)=>{if(tops[i]) p.scrollTop=tops[i];});
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>pager.scrollTo({left:pager.clientWidth*(+b.dataset.i),behavior:'smooth'}));
  pager.onscroll=()=>{const i=Math.round(pager.scrollLeft/Math.max(1,pager.clientWidth));tabs.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));};
  pager.onscroll();
  attachLong(pager);
  const sh=$('#btnShare');if(sh) sh.onclick=shareCard;

/* ---------- why this stop: graphic ---------- */
function whyChart(pA,pD,lead,gf){
  const W=330,H=170,l=26,b=24,t=12,bw=(W-l-6)/16;
  const vmax=Math.max(100,...(pA||[]),...(pD||[]),gf||0);
  const Y=v=>t+(H-t-b)*(1-Math.max(0,v)/vmax);
  let g='';
  for(const v of [0,50,100]) g+='<line x1="'+l+'" x2="'+(W-4)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(l-5)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--ink2)">'+v+'</text>';
  for(let i=0;i<16;i++){
    const x=l+i*bw+2, w=bw-4, isL=lead&&lead.i===i, col=isL?'var(--warn)':'var(--ink)';
    if(pA){const ya=Y(pA[i]);g+='<rect x="'+x+'" y="'+ya+'" width="'+w+'" height="'+Math.max(0,Y(0)-ya)+'" rx="2" fill="none" stroke="'+col+'" stroke-opacity=".55" stroke-dasharray="3 2"/>';}
    if(pD){const yd=Y(pD[i]);g+='<rect x="'+(x+2)+'" y="'+yd+'" width="'+Math.max(1,w-4)+'" height="'+Math.max(0,Y(0)-yd)+'" rx="2" fill="'+col+'"/>';}
    if(i===0||i===15||isL) g+='<text x="'+(x+w/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="'+(isL?'var(--warn)':'var(--ink2)')+'">'+(i+1)+'</text>';
  }
  if(gf){const y=Y(gf);g+='<line x1="'+l+'" x2="'+(W-4)+'" y1="'+y+'" y2="'+y+'" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 4"/><text x="'+(W-6)+'" y="'+(y-5)+'" text-anchor="end" font-size="11" fill="var(--warn)">per ripartire '+Math.round(gf)+'%</text>';}
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Saturazione dei 16 compartimenti in percentuale del valore M, all’arrivo e alla partenza">'+g+'</svg>';
}
function openWhy(r,si){
  if(!r||!r.stops) return;
  const x=r.stops[si];if(!x) return;
  const next=si+1<r.stops.length?r.stops[si+1].d:0;
  let L=x.lead, pA=x.pA, pD=x.pD;
  if(!L&&r.simplified&&PLAN&&PLAN.main.ok){const o=PLAN.main.stops.find(q=>q.d===x.d&&q.lead);if(o) L=o.lead;}
  const tipo=L?(L.htN<=20?'veloce':L.htN<=110?'intermedio':'lento'):'';
  let chips='<span class="pill">'+esc(x.gas)+'</span>';
  if(x.sw&&x.from) chips+='<span class="pill warn">Cambio da '+esc(gasName(x.from))+'</span>';
  if(L){
    const tot=L.pn+L.ph+(L.px||0), he=tot>0?Math.round(L.ph/tot*100):0, hx=tot>0?Math.round((L.px||0)/tot*100):0;
    chips+='<span class="pill" data-th="model">Comanda il n. '+(L.i+1)+', '+tipo+'</span><span class="pill">'+(he?'Elio '+he+'%':'')+(hx?(he?', ':'')+'idrogeno '+hx+'%':'')+(he||hx?', ':'')+'azoto '+(100-he-hx)+'%</span>';
  }
  if(r.simplified) chips+='<span class="pill">Piano semplificato</span>';
  openMini('<div class="whyhead"><h2 class="serif">'+fmt(x.d,0)+' m</h2><span class="serif whyt">'+Math.round(x.dur)+'′</span><span class="whyn">→ '+(next?fmt(next,0)+' m':'superficie')+'</span></div>'+
    '<div class="pills" style="margin:6px 0 10px">'+chips+'</div>'+
    (pA||pD?'<div class="card glass" style="padding:10px 10px 4px">'+whyChart(pA,pD,L,L?L.gf:null)+'</div><p class="hint" style="margin:8px 2px 0">Quanto ogni compartimento è vicino al suo limite (valore M): tratteggio all’arrivo, pieno alla partenza. Dai veloci (1) ai lenti (16).</p>':'')+
    '<div class="btns" style="grid-template-columns:1fr"><button class="cta" type="button" id="whyOk">Chiudi</button></div>');
  attachLong($('#miniBody'));
  $('#whyOk').onclick=closeMini;
}

/* reverse planning */
function invFeasible(t){
  const T=deep(S), i=S.act, delta=t-S.levels[i].t;
  for(let j=i;j<T.levels.length;j++) T.levels[j].t+=delta;
  const r=plan(T);
  if(!r.ok||r.W.some(w=>w.lvl==='err')) return false;
  const v=S.inv;
  if(v.rtOn&&r.runtime>v.rt) return false;
  if(v.ttsOn&&r.tts>v.tts) return false;
  if(v.cnsOn&&r.cns>v.cns) return false;
  if(v.gasOn){
    if(T.mode==='oc'){if(gasReport(r).some(x=>!x.virtual&&x.lvl!=='ok')) return false;}
    else{
      const c=T.ccr;
      if(c.metab*r.runtime>c.o2Vol*c.o2Bar) return false;
      if(c.loop*(r.E.P(r.maxD)-r.E.ps)+c.dilExtra>c.dilVol*c.dilBar) return false;
      const b=plan(T,{bailout:true});
      if(!b.ok||gasReport(b).some(x=>!x.virtual&&x.lvl!=='ok')) return false;
    }
  }
  return true;
}
function invSolve(){
  const v=S.inv;
  if(!v.rtOn&&!v.ttsOn&&!v.cnsOn&&!v.gasOn) return {none:true};
  const T=deep(S), i=S.act, d0=timeMin(i)-S.levels[i].t;
  for(let j=i;j<T.levels.length;j++) T.levels[j].t+=d0;
  const r0=plan(T);
  if(r0.error) return {t:null};
  const lv=r0.levels[i];
  let lo=Math.max(timeMin(i),Math.ceil(lv.rt-lv.dur-1e-6)+1);
  if(!invFeasible(lo)) return {t:null};
  let hi=lo+8;
  while(invFeasible(hi)&&hi<4000){lo=hi;hi=lo*2;}
  while(hi-lo>1){const mid=Math.floor((lo+hi)/2);if(invFeasible(mid)) lo=mid;else hi=mid;}
  return {t:lo};
}
